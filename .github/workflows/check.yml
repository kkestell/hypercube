name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: internal/ui/package.json
      - run: make check

  linux-test:
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu, fedora, arch]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: make linux-test LINUX_DISTRO=${{ matrix.distro }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-test-${{ matrix.distro }}
          path: bin/linux-test/
          if-no-files-found: ignore
