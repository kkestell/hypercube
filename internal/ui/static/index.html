<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<title>Hypercube</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui.css">
</head>
<body class="h-full overflow-hidden bg-[#1e1e1e] text-sm text-neutral-300">
<div class="flex h-full flex-col">
<header class="flex h-9 shrink-0 items-center gap-1 border-b border-[#2b2b2b] bg-[#323233] px-2">
  <button type="button" id="toggle-sidebar" title="Hide Left Panel" aria-pressed="true" class="ml-auto flex rounded p-1 text-neutral-400 hover:bg-neutral-700 hover:text-neutral-100">
    <span class="icon icon-layout-sidebar-left size-4"></span>
  </button>
  <button type="button" id="toggle-panel" title="Show Panel" aria-pressed="false" class="flex rounded p-1 text-neutral-400 hover:bg-neutral-700 hover:text-neutral-100">
    <span class="icon icon-layout-panel-off size-4"></span>
  </button>
  <button type="button" id="toggle-right-panel" title="Hide Right Panel" aria-label="Hide Right Panel" aria-controls="right-panel" aria-expanded="true" class="flex rounded p-1 text-neutral-400 hover:bg-neutral-700 hover:text-neutral-100">
    <span class="icon icon-layout-sidebar-left size-4 rotate-180"></span>
  </button>
</header>

<div class="flex min-h-0 flex-1">
  <aside id="sidebar" class="flex w-[260px] shrink-0 flex-col bg-[#252526]">
    <div class="flex h-[38px] shrink-0 items-center justify-between px-2 text-[11px] font-semibold tracking-wide text-neutral-400 uppercase">
      Workspaces
      <button type="button" id="add-workspace" title="New Workspace" class="flex size-[22px] items-center justify-center rounded text-neutral-300 hover:bg-[#5a5d5e50]"><span class="icon icon-add size-4"></span></button>
    </div>
    <ul id="sessions" class="min-h-0 flex-1 overflow-auto"></ul>
  </aside>
  <div id="sidebar-sash" class="sash"></div>
  <div class="flex min-w-0 flex-1 flex-col">
    <div id="center" class="relative flex min-h-0 flex-1 bg-[#181818]">
      <canvas id="hypercube" class="pointer-events-none absolute inset-0 size-full opacity-0 transition-opacity duration-1000" hidden></canvas>
      <div id="transcripts" class="flex min-h-0 min-w-0 flex-1 overflow-hidden">
        <div id="lead-column" class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden"></div>
        <div id="lead-sash" class="sash" role="separator" aria-label="Resize lead column" aria-orientation="vertical" aria-controls="lead-column worker-tabs" hidden></div>
        <div id="worker-tabs" class="flex min-h-0 min-w-0 flex-1 overflow-hidden" hidden></div>
      </div>
    </div>
    <div id="panel-sash" class="sash" aria-orientation="horizontal" hidden></div>
    <div id="panel" class="h-[240px] max-h-[80vh] shrink-0 overflow-hidden pt-1 pl-2" hidden></div>
  </div>
  <aside id="right-panel" aria-label="Session details" class="flex w-[320px] max-w-[40vw] shrink-0 flex-col border-l border-[#2b2b2b] bg-[#252526]">
    <div id="right-panel-tabs" role="tablist" aria-label="Session details" class="flex h-[35px] shrink-0 border-b border-[#2b2b2b] bg-[#181818]">
      <button type="button" id="workers-tab" role="tab" aria-label="Workers" title="Workers" aria-controls="workers-panel" aria-selected="true" class="right-panel-tab"><span class="icon icon-workers size-4"></span></button>
      <button type="button" id="files-tab" role="tab" aria-label="Files" title="Files" aria-controls="files-panel" aria-selected="false" tabindex="-1" class="right-panel-tab"><span class="icon icon-folder size-4"></span></button>
      <button type="button" id="changes-tab" role="tab" aria-label="Changes" title="Changes" aria-controls="changes-panel" aria-selected="false" tabindex="-1" class="right-panel-tab"><span class="icon icon-diff size-4"></span></button>
    </div>
    <div id="workers-panel" role="tabpanel" aria-labelledby="workers-tab" tabindex="0" class="min-h-0 flex-1 overflow-y-auto p-3 text-xs">
      <div id="worker-cards" class="flex flex-col gap-2"></div>
    </div>
    <div id="files-panel" role="tabpanel" aria-labelledby="files-tab" class="flex min-h-0 flex-1 flex-col" hidden></div>
    <div id="changes-panel" role="tabpanel" aria-labelledby="changes-tab" tabindex="0" class="min-h-0 flex-1 overflow-y-auto" hidden></div>
  </aside>
</div>
</div>

<div id="menu" role="menu" hidden class="fixed z-50 max-h-screen min-w-[160px] max-w-full overflow-auto rounded-[5px] border border-[#454545] bg-[#252526] py-1 text-[13px] shadow-lg shadow-black/50"></div>
<script src="hypercube.js"></script>
<script type="module">
import {Transcript, imageSrc, renderMarkdown, submitsOnKey} from './transcript.js';
import {createTerminal} from './terminal.js';
import {TabLayout, TabContainer} from './tabs.js';
import {FileTree, files, fileIcon, language, seti} from './files.js';

// The lead stays in its own column. Worker transcripts and files open in the
// tab area to its right; only that area accepts tab moves and splits.
const $ = id => document.getElementById(id);
const transcripts = $('transcripts'), leadColumn = $('lead-column'), tabArea = $('worker-tabs'), leadSash = $('lead-sash');
const workerCards = $('worker-cards'), rightPanel = $('right-panel');
const sessionList = $('sessions'), sidebar = $('sidebar'), panel = $('panel');

// data is the app's latest snapshot, selected is the selected session's ID,
// or null once the selected session stops, and attached is the running session
// whose agents are shown. pending is a session to select once the data lists
// it. unsent is the new session the user has opened but not yet sent a prompt
// to: its workspace, lead profile, and the profile's harness, model, and
// effort. It exists only in this page until its first prompt creates the
// session, and it shows a lead pane under the id unsentId.
let data = [], selected = decodeURIComponent(location.hash.slice(1)), pending = null, attached = null, unsent = null;
const unsentId = 'new';
// The layout belongs to the currently attached session.
let shown = null, tabLayout = null, tabContainer = null;
// Each agent's unsent text and images outlive its card, and each agent has one
// transcript and one card while its session is attached.
const drafts = new Map(), attachments = new Map(), views = new Map(), cards = new Map();

const sessions = () => data.flatMap(w => w.sessions);
const current = () => sessions().find(s => s.id === selected);
const unsentAgent = () => ({id: unsentId, name: 'lead', role: 'lead', activity: unsent.sending ? 'busy' : 'idle',
  harness: unsent.harness, model: unsent.model, effort: unsent.effort});

// discardUnsent drops the unsent session with its draft and attachments.
function discardUnsent() {
  if (!unsent) return;
  unsent = null;
  drafts.delete(unsentId);
  attachments.delete(unsentId);
  cards.get(unsentId)?.element.remove();
  cards.delete(unsentId);
  views.delete(unsentId);
}
// A running session whose lead has exited, as after a failed start, can be
// started again.
const failed = s => s.running && s.agents.some(a => a.role === 'lead' && a.activity === 'exited');

const connect = path => new WebSocket(new URL(path, location.href.replace(/^http/, 'ws')));

// The data socket tells the app which session's transcripts to send; after a
// reconnect the app sends them whole again.
let state = null;
function announce() {
  if (state?.readyState === WebSocket.OPEN) state.send(JSON.stringify({select: attached ?? ''}));
}

function watch() {
  const socket = state = connect('state');
  socket.onopen = announce;
  socket.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') { data = msg.workspaces; changed(); }
    else if (msg.type === 'transcript') received(msg);
  };
  socket.onclose = () => { state = null; setTimeout(watch, 1000); };
}

function view(agent) {
  let v = views.get(agent);
  if (!v) {
    const answer = (item, choice, text) => post('agent?' + new URLSearchParams({action: 'answer', id: agent, request: item.id, choice}), text);
    v = new Transcript(document, {answer: async (...args) => await answer(...args) !== null});
    views.set(agent, v);
  }
  return v;
}

// received adds items to an agent's transcript, if its session is shown.
function received(msg) {
  if (!sessions().some(s => s.id === attached && s.agents.some(a => a.id === msg.agent))) return;
  const v = view(msg.agent);
  if (msg.reset) v.reset(msg.items); else v.update(msg.items);
}

// changed shows new data: the title, the sidebar, and the selected session,
// attaching to its agents when it runs.
function changed() {
  if (unsent && !data.some(w => w.id === unsent.workspace)) discardUnsent();
  const all = sessions();
  if (pending && all.some(s => s.id === pending)) { selected = pending; pending = null; }
  // A session that stops while shown is deselected, and nothing is selected
  // in its place. Otherwise a selection naming no session moves to a running
  // one, if any.
  const chosen = current();
  if (chosen && !chosen.running && attached === chosen.id) selected = null;
  else if (selected !== null && !chosen) selected = all.find(s => s.running)?.id ?? '';
  if (decodeURIComponent(location.hash.slice(1)) !== (selected ?? '')) history.replaceState(null, '', selected ? '#' + encodeURIComponent(selected) : location.pathname);
  const s = current();
  const waiting = all.filter(s => s.running).reduce((n, s) => n + s.agents.filter(a => a.attention).length, 0);
  const workspace = unsent ? data.find(w => w.id === unsent.workspace) : data.find(w => w.sessions.includes(s));
  document.title = (waiting ? `(${waiting}) ` : '') + [s?.title, workspace?.name, 'Hypercube'].filter(Boolean).join(' — ');
  renderSidebar();
  $('hypercube').hidden = !!(s || unsent);
  const want = s?.running ? s.id : null;
  if (want !== attached) attach(want);
  else render();
  if (s?.unseen && document.visibilityState === 'visible') fetch('session?' + new URLSearchParams({action: 'seen', id: s.id}), {method: 'POST'});
}
document.addEventListener('visibilitychange', changed);

// Selecting a stopped session starts it. A new session's ID can arrive before
// the state that lists it, so the selection waits for that state.
function select(id) {
  discardUnsent();
  if (!sessions().some(s => s.id === id)) { pending = id; return; }
  pending = null;
  selected = id;
  changed();
  const s = current();
  if (s && (!s.running || failed(s))) post('session?' + new URLSearchParams({action: 'start', id}));
}

function attach(id) {
  attached = id;
  views.clear();
  cards.clear();
  shown = null;
  leadColumn.replaceChildren();
  tabArea.replaceChildren();
  tabArea.hidden = leadSash.hidden = true;
  leadColumn.style.flex = tabArea.style.flex = '';
  workerCards.replaceChildren();
  tabLayout = tabContainer = null;
  scrolls.clear();
  fileTabs.clear();
  preview = null;
  fileTree.reset(!!id, dir => files.list(id, dir));
  closeShell();
  announce();
  if (!id && !unsent) return;
  render();
  if (panelOpen) connectShell();
  cards.get(shown.leader?.id)?.field.focus();
}

const names = agents => agents.map(a => a.name).join(', ');

const escape = text => text.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

// update replaces an element's children only when they change. A click is lost
// when the element under the pointer is replaced between press and release.
// Parsing the new HTML first compares it as the page would serialize it.
function update(parent, html) {
  const next = document.createElement('template');
  next.innerHTML = html;
  if (parent.innerHTML !== next.innerHTML) parent.replaceChildren(next.content);
}

// State updates change transcript content and previews without rebuilding panes.
function render() {
  const s = current();
  const agents = unsent ? [unsentAgent()] : attached && s?.running ? s.agents : [];
  const leader = agents.find(a => a.role === 'lead');
  const stacked = agents.filter(a => a !== leader);
  shown = {leader, stacked};
  agents.forEach(card);
  for (const [id, c] of cards) {
    if (!agents.some(a => a.id === id)) {
      tabLayout?.close(id);
      c.element.remove();
      cards.delete(id);
      views.delete(id);
      scrolls.delete(id);
    }
  }
  if (leader) {
    const element = cards.get(leader.id).element;
    if (element.parentElement !== leadColumn) leadColumn.append(element);
    if (!tabLayout) {
      tabLayout = new TabLayout();
      tabContainer = new TabContainer(tabArea, tabLayout, renderTabs);
    }
  }
  renderTabs();
  update(workerCards, stacked.map(a => `<article class="rounded border ${a.attention ? 'border-amber-400' : 'border-[#454545]'} bg-[#1e1e1e] p-3">
    <header class="mb-2 flex items-center gap-2">
      <span class="min-w-0 flex-1 truncate text-sm text-neutral-100">${escape(a.name)}</span>
      ${agentStatus(a)}
      <button type="button" data-open-worker="${escape(a.id)}" title="Open Transcript" class="flex size-6 shrink-0 items-center justify-center rounded text-neutral-300 hover:bg-[#5a5d5e50]"><span class="icon icon-layout-sidebar-left size-4"></span></button>
    </header>
    ${summary(a) || '<p class="text-neutral-500">No update yet.</p>'}
  </article>`).join('') || '<p class="py-3 text-neutral-500">No workers yet.</p>');
}

// Remember a scrolled-up transcript when its tab is hidden or moved.
const scrolls = new Map();
function renderTabs() {
  if (!tabContainer) return;
  const returnFocus = !tabLayout.root && tabArea.contains(document.activeElement);
  tabArea.hidden = leadSash.hidden = !tabLayout.root;
  for (const [id, v] of views) {
    if (v.root.clientHeight) scrolls.set(id, {top: v.root.scrollTop, following: v.following});
  }
  for (const [id, f] of fileTabs) {
    if (!tabLayout.find(id)) fileTabs.delete(id);
    else if (f.element.clientHeight) f.scroll = [f.element.scrollTop, f.element.scrollLeft];
  }
  if (!fileTabs.has(preview)) preview = null;
  tabContainer.render([...shown.stacked.map(a => {
    const c = cards.get(a.id);
    return {id: a.id, label: c.label, status: c.status, element: c.element};
  }), ...[...fileTabs].map(([id, f]) => ({id, label: f.name, title: f.path + (f.deleted ? ' (deleted)' : ''), deleted: f.deleted, icon: f.icon, element: f.element,
    preview: id === preview, keepOpen: () => keepOpen(id)}))]);
  for (const f of fileTabs.values()) {
    if (f.element.clientHeight && f.scroll) [f.element.scrollTop, f.element.scrollLeft] = f.scroll;
  }
  for (const [id, v] of views) {
    if (!v.root.clientHeight) continue;
    const saved = scrolls.get(id);
    v.following = saved?.following ?? true;
    if (v.following) v.end();
    else { v.root.scrollTop = saved.top; v.top = v.root.scrollTop; }
  }
  if (returnFocus) cards.get(shown.leader?.id)?.field.focus();
}

// The Files tab shows the session's working directory. As in VS Code, a single
// click opens a file in the preview tab, which has an italic title and which
// the next file opened replaces. Double-clicking the file or the preview tab
// keeps it open as a regular tab. A file already open selects its tab.
const fileTabs = new Map();
let preview = null;
const fileTree = new FileTree($('files-panel'), {list: dir => files.list(attached, dir), open: openFile,
  keepOpen: path => keepOpen('file:' + encodeURIComponent(path))});

function keepOpen(id) {
  if (preview !== id) return;
  preview = null;
  renderTabs();
}

async function openFile(path) {
  const generation = fileTree.generation;
  const theme = await seti();
  if (generation !== fileTree.generation || !tabLayout) return;
  const id = 'file:' + encodeURIComponent(path);
  if (!fileTabs.has(id)) {
    const name = path.slice(path.lastIndexOf('/') + 1);
    const element = document.createElement('div');
    element.className = 'file-view';
    const file = {path, name, element, icon: fileIcon(theme, name), etag: null, deleted: false};
    fileTabs.set(id, file);
    showFile(file);
    if (tabLayout.find(preview)) tabLayout.replace(preview, id);
    preview = id;
  }
  tabLayout.open(id);
  renderTabs();
}

// showFile fills a file's tab: Markdown as VS Code's preview shows it, and
// other files as highlighted source with line numbers.
async function showFile(file, polling = false) {
  const session = attached, generation = fileTree.generation;
  const current = () => generation === fileTree.generation && [...fileTabs.values()].includes(file);
  let result;
  try {
    result = await files.read(session, file.path, file.etag);
  } catch (error) {
    if (polling) return;
    result = {message: error.message};
  }
  if (!current() || result.unchanged || (polling && result.message)) return;
  if (result.deleted) {
    file.etag = null;
    if (!file.deleted) {
      file.deleted = true;
      renderTabs();
    }
    return;
  }
  if (file.deleted) {
    file.deleted = false;
    renderTabs();
  }
  if (result.message && result.message === file.message) return;
  const {element, name} = file;
  const scroll = [element.scrollTop, element.scrollLeft];
  if (result.message) {
    const message = document.createElement('div');
    message.className = 'file-message';
    message.textContent = result.message;
    element.replaceChildren(message);
  } else {
    const {highlight} = await import('./viewer.js');
    if (!current()) return;
    const lang = language(name), text = result.text;
    if (lang === 'markdown') {
      const preview = document.createElement('div');
      preview.className = 'markdown-preview';
      preview.append(...renderMarkdown(document, text));
      for (const code of preview.querySelectorAll('pre > code[data-lang]')) {
        code.innerHTML = highlight(code.textContent, code.dataset.lang).join('\n');
      }
      element.replaceChildren(preview);
    } else {
      const lines = highlight(text, lang);
      element.innerHTML = `<div class="code-gutter" style="--digits:${Math.max(5, String(lines.length).length)}">${lines.map((_, i) => i + 1).join('\n')}</div><pre class="code-lines">${lines.join('\n')}</pre>`;
    }
  }
  file.etag = result.etag ?? null;
  file.message = result.message;
  [element.scrollTop, element.scrollLeft] = scroll;
}

let polling = false;
async function poll() {
  if (document.hidden || !attached || polling) return;
  polling = true;
  const generation = fileTree.generation;
  try {
    if ($('files-panel').clientHeight) await fileTree.refresh();
    for (const file of fileTabs.values()) {
      if (generation !== fileTree.generation) return;
      if (file.element.clientHeight) await showFile(file, true);
    }
  } finally {
    polling = false;
  }
}
setInterval(poll, 1000);

workerCards.onclick = e => {
  const button = e.target.closest('[data-open-worker]');
  if (!button) return;
  const id = button.dataset.openWorker;
  tabLayout.open(id);
  renderTabs();
  cards.get(id).field.focus();
};

// The sidebar lists each workspace's sessions by activity below a row that
// collapses them, five more each time the user asks. It stays as it is while a
// session is being renamed.
let renaming = false;
const collapsed = new Set(), limits = new Map();
const pageSize = 5;

const iconButton = 'invisible flex size-[22px] shrink-0 items-center justify-center rounded text-neutral-300 group-hover:visible group-focus-within:visible hover:bg-[#5a5d5e50]';

function renderSidebar() {
  if (renaming) return;
  update(sessionList, data.map(w => {
    const open = !collapsed.has(w.id);
    const newest = w.sessions, limit = limits.get(w.id) ?? pageSize;
    return `<li class="group mx-1.5 flex h-[26px] items-center gap-0.5 rounded-md pr-1 hover:bg-[#2a2d2e]" data-workspace="${w.id}" title="${escape(w.path)}">
        <button type="button" data-collapse="${w.id}" aria-expanded="${open}" class="flex min-w-0 flex-1 items-center gap-2 self-stretch pl-2 text-left text-neutral-400">
          <span class="icon ${open ? 'icon-folder-opened' : 'icon-folder'} size-4"></span><span class="truncate">${escape(w.name)}</span>
        </button>
        <button type="button" title="More Actions" aria-haspopup="menu" class="${iconButton}" data-more="${w.id}"><span class="icon icon-ellipsis size-4"></span></button>
        <button type="button" title="New Session" aria-haspopup="menu" class="${iconButton}" data-leads="${w.id}"><span class="icon icon-new-session size-4"></span></button>
      </li>` +
      (open ? newest.slice(0, limit).map(sessionRow).join('') +
        (newest.length > limit ? `<li class="mx-1.5"><button type="button" data-show-more="${w.id}" class="flex h-[26px] w-full items-center pl-8 text-left text-neutral-500 hover:text-neutral-300">Show more</button></li>` : '')
      : '');
  }).join(''));
}

sessionList.addEventListener('click', e => {
  const header = e.target.closest('[data-collapse]'), more = e.target.closest('[data-show-more]');
  if (header) {
    const id = header.dataset.collapse;
    if (!collapsed.delete(id)) collapsed.add(id);
  } else if (more) {
    const id = more.dataset.showMore;
    limits.set(id, (limits.get(id) ?? pageSize) + pageSize);
  } else {
    return;
  }
  renderSidebar();
});

// Double-clicking a session replaces it with a field for its new title. Enter
// or leaving the field saves the title, and Escape cancels.
sessionList.addEventListener('dblclick', e => {
  const row = e.target.closest('[data-session]');
  const s = sessions().find(s => s.id === row?.dataset.session);
  if (!s) return;
  renaming = true;
  const input = document.createElement('input');
  input.value = s.title;
  input.className = 'mx-1.5 block h-[26px] w-[calc(100%-0.75rem)] rounded-md border border-sky-500 bg-[#3c3c3c] pr-2 pl-[31px] text-neutral-100 outline-none';
  row.replaceWith(input);
  input.focus();
  input.select();
  const finish = save => {
    if (!renaming) return;
    renaming = false;
    const title = input.value.trim();
    if (save && title && title !== s.title) {
      post('session?' + new URLSearchParams({action: 'rename', id: s.id, title}));
      s.title = title;
    }
    sessionList.replaceChildren();
    renderSidebar();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') finish(true);
    else if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
});

// A stopped session's row is dimmed. Busy and waiting agents show only while
// the session runs. Their indicators sit at the right of the row over a
// gradient in the row's background color, which fades out the title beneath.
function sessionRow(s) {
  const active = s.id === selected;
  const busy = s.running ? names(s.agents.filter(a => a.activity === 'busy')) : '';
  const waiting = s.running ? names(s.agents.filter(a => a.attention)) : '';
  const text = !s.running ? 'text-neutral-500' : active ? 'text-neutral-100' : '';
  const background = active ? 'bg-[#37373d] [--row:#37373d]' : '[--row:#252526] hover:bg-[#2a2d2e] hover:[--row:#2a2d2e]';
  const indicators = (busy ? `<span role="img" title="Busy: ${escape(busy)}" class="icon icon-loading size-4 text-neutral-400"></span>` : '') +
    (waiting ? `<span title="Waiting on you: ${escape(waiting)}" class="size-2 shrink-0 rounded-full bg-amber-400"></span>` : '') +
    (s.unseen && !active ? '<span title="New reply" class="size-2 shrink-0 rounded-full bg-sky-400"></span>' : '');
  return `<li class="mx-1.5 rounded-md ${background} ${text}" data-session="${s.id}">
    <button type="button" data-select="${s.id}" class="relative flex h-[26px] w-full items-center pr-2 pl-8 text-left">
      <span class="truncate">${escape(s.title)}</span>
      ${indicators ? `<span class="absolute inset-y-0 right-0 flex items-center gap-1.5 rounded-r-md bg-linear-to-r from-transparent to-(--row) to-40% pr-2 pl-6">${indicators}</span>` : ''}
    </button>
  </li>`;
}

// Token counts read as 845, 84k, 1.2M.
function tokens(n) {
  if (n < 1000) return String(n);
  const [scale, unit] = n < 1e6 ? [1e3, 'k'] : [1e6, 'M'];
  return (n < 10 * scale ? Math.floor(n / scale * 10) / 10 : Math.floor(n / scale)) + unit;
}

// A report's age reads as now, 3m, 2h, 1d.
function age(ms) {
  const minutes = Math.floor((Date.now() - ms) / 60000);
  if (minutes < 1) return 'now';
  if (minutes < 60) return minutes + 'm';
  return minutes < 1440 ? Math.floor(minutes / 60) + 'h' : Math.floor(minutes / 1440) + 'd';
}

// Usage appears below the message input.
function usage(a) {
  const {context = 0, window = 0, cost = 0} = a.usage ?? {};
  const radius = 6, circumference = 2 * Math.PI * radius;
  const ring = window ? `<svg viewBox="0 0 16 16" class="size-3.5 shrink-0 -rotate-90">
        <circle cx="8" cy="8" r="${radius}" fill="none" stroke="currentColor" stroke-width="2" class="text-neutral-500"/>
        <circle cx="8" cy="8" r="${radius}" fill="none" stroke="currentColor" stroke-width="2" class="text-sky-400"
          stroke-dasharray="${circumference}" stroke-dashoffset="${(circumference * (1 - Math.min(1, context / window))).toFixed(2)}"/>
      </svg>` : '';
  const contextUse = window ? `<span class="flex items-center gap-1.5 whitespace-nowrap">${ring}${tokens(context)} / ${tokens(window)}</span>` : '';
  const spent = cost ? `<span class="whitespace-nowrap">${cost < 0.01 ? '<$0.01' : `$${cost.toFixed(2)}`}</span>` : '';
  return contextUse + spent;
}

function summary(a) {
  return a.status ? `<p class="line-clamp-4 break-words text-neutral-300">${escape(a.status)}</p>
    <footer class="flex justify-end text-neutral-500">${age(a.statusAt)}</footer>` : '';
}

// Transcript cards persist across tab moves and closes so drafts survive.
function card(a) {
  let c = cards.get(a.id);
  if (!c) {
    const element = document.createElement('article');
    element.dataset.agent = a.id;
    element.innerHTML = `<div class="slot flex min-h-[120px] min-w-0 flex-1 flex-col overflow-hidden bg-[#1e1e1e]">
        <form class="m-4 flex shrink-0 flex-col gap-2 rounded-lg border border-[#3c3c3c] bg-[#3c3c3c] p-2 focus-within:border-sky-500">
          <div class="previews flex flex-wrap gap-2" hidden></div>
          <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
          <textarea rows="1" aria-label="Message" class="field-sizing-content max-h-40 min-h-7 min-w-0 resize-none bg-transparent px-2 py-1 text-[13px] text-neutral-100 outline-none"></textarea>
          <div class="flex items-center gap-2">
            <button type="button" title="Attach Image" aria-label="Attach Image" class="attach flex size-7 shrink-0 items-center justify-center rounded text-neutral-300 hover:bg-[#5a5d5e50]"><span class="icon icon-attach size-4"></span></button>
            <div class="flex min-w-0 flex-1 flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-neutral-400">
              <span class="config min-w-0 truncate"></span>
              <span class="usage ml-auto flex shrink-0 items-center gap-3"></span>
            </div>
            <div class="flex shrink-0 gap-1">
              <button type="button" title="Stop" class="stop flex size-7 shrink-0 items-center justify-center rounded text-neutral-300 hover:bg-[#5a5d5e50]"><span class="icon icon-stop-circle size-4"></span></button>
              <button type="submit" title="Send" class="send flex size-7 shrink-0 items-center justify-center rounded text-neutral-300 hover:bg-[#5a5d5e50] disabled:opacity-40 disabled:hover:bg-transparent"><span class="icon icon-send size-4"></span></button>
            </div>
          </div>
        </form>
      </div>`;
    const q = name => element.querySelector('.' + name);
    c = {element, label: a.name, usage: q('usage'), status: document.createElement('span'),
      config: q('config'), form: element.querySelector('form'), field: element.querySelector('textarea'), stop: q('stop'), send: q('send'),
      previews: q('previews'), attach: q('attach'), file: element.querySelector('input[type=file]')};
    c.status.className = 'flex shrink-0 items-center';
    if (a.role === 'lead') {
      element.setAttribute('aria-label', 'Lead transcript');
      c.config.parentElement.prepend(c.status);
    }
    q('slot').prepend(view(a.id).root);
    c.field.value = drafts.get(a.id) ?? '';
    c.field.oninput = () => {
      if (c.field.value) drafts.set(a.id, c.field.value); else drafts.delete(a.id);
      c.send.disabled = !hasContent(a.id, c);
    };
    c.attach.onclick = () => c.file.click();
    c.file.onchange = () => {
      const files = [...c.file.files];
      c.file.value = '';
      attachImages(a.id, c, files);
    };
    // Images dropped anywhere on the pane attach to its agent. Drags of tabs
    // carry no files and pass through.
    c.element.ondragover = e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      c.element.dataset.dropping = '';
    };
    c.element.ondragleave = e => {
      if (!c.element.contains(e.relatedTarget)) delete c.element.dataset.dropping;
    };
    c.element.ondrop = e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      delete c.element.dataset.dropping;
      attachImages(a.id, c, [...e.dataTransfer.files]);
    };
    showAttachments(a.id, c);
    c.field.onkeydown = e => {
      if (!submitsOnKey(e)) return;
      e.preventDefault();
      submit(a.id, c);
    };
    c.form.onsubmit = e => { e.preventDefault(); submit(a.id, c); };
    c.stop.onclick = () => post('agent?' + new URLSearchParams({action: 'interrupt', id: a.id}));
    cards.set(a.id, c);
  }
  const className = `relative flex min-h-0 min-w-0 flex-1 flex-col border bg-[#1e1e1e] text-xs data-dropping:outline-2 data-dropping:-outline-offset-2 data-dropping:outline-sky-500 ${
    a.attention ? 'border-amber-400' : 'border-[#2b2b2b]'}`;
  if (c.element.className !== className) c.element.className = className;
  c.label = a.name;
  update(c.status, agentStatus(a));
  c.status.hidden = !c.status.hasChildNodes();
  update(c.usage, usage(a));
  const config = [a.harness, a.model, a.effort].filter(Boolean).join(' · ');
  if (c.config.textContent !== config) c.config.textContent = config;
  c.stop.hidden = a.activity !== 'busy' || a.id === unsentId;
  c.send.disabled = !hasContent(a.id, c) || a.activity === 'exited' || a.id === unsentId && unsent.sending;
  return c;
}

// A prompt has text, images, or both. Images are PNG, JPEG, GIF, or WebP
// totalling at most 10 MiB, which the server checks again.
const imageTypes = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
const maxImageBytes = 10 << 20;
// A prompt waits for images still being read.
const hasContent = (agent, c) => !c.pending && (!!c.field.value.trim() || !!attachments.get(agent)?.length);
const hasFiles = e => e.dataTransfer?.types.includes('Files');
const imageBytes = images => images.reduce((n, i) => n + i.data.length * 3 / 4 - (i.data.match(/=*$/)[0].length), 0);

function readImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({mime_type: file.type, data: reader.result.slice(reader.result.indexOf(',') + 1)});
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// attachImages adds the image files to the agent's unsent prompt.
async function attachImages(agent, c, files) {
  if (!files.length) return;
  const first = agent === unsentId ? unsent : null;
  const images = files.filter(f => imageTypes.includes(f.type));
  if (images.length < files.length) alert('Attach PNG, JPEG, GIF, or WebP images.');
  c.pending = (c.pending ?? 0) + 1;
  c.send.disabled = true;
  try {
    const added = await Promise.all(images.map(readImage));
    if (first && unsent !== first) return;
    const all = [...(attachments.get(agent) ?? []), ...added];
    if (imageBytes(all) > maxImageBytes) {
      alert('Images can total at most 10 MiB.');
    } else if (added.length) {
      attachments.set(agent, all);
    }
  } catch (err) {
    alert('Reading the image failed: ' + err.message);
  } finally {
    c.pending--;
    showAttachments(agent, c);
  }
}

// showAttachments draws the agent's unsent images above its message field,
// each with a button that removes it.
function showAttachments(agent, c) {
  const images = attachments.get(agent) ?? [];
  c.previews.replaceChildren(...images.map(image => {
    const img = document.createElement('img');
    img.className = 'size-14 rounded object-cover';
    img.alt = 'Attached image';
    img.src = imageSrc(image);
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.title = 'Remove Image';
    remove.setAttribute('aria-label', 'Remove Image');
    remove.className = 'absolute -top-1 -right-1 flex size-4 items-center justify-center rounded-full bg-[#37373d] text-neutral-200 hover:bg-neutral-600';
    remove.innerHTML = '<span class="icon icon-close size-3"></span>';
    remove.onclick = () => {
      const rest = (attachments.get(agent) ?? []).filter(i => i !== image);
      if (rest.length) attachments.set(agent, rest); else attachments.delete(agent);
      showAttachments(agent, c);
    };
    const box = document.createElement('div');
    box.className = 'relative';
    box.append(img, remove);
    return box;
  }));
  c.previews.hidden = !images.length;
  c.send.disabled = !hasContent(agent, c);
}

// submit sends a card's text and images to its agent. The unsent session's
// prompt creates the session, which is then selected. A refused prompt returns
// to the composer unless the user has started another.
async function submit(agent, c) {
  const text = c.field.value, images = attachments.get(agent) ?? [];
  if (!hasContent(agent, c) || c.send.disabled) return;
  const first = agent === unsentId ? unsent : null;
  if (first?.sending) return;
  c.field.value = '';
  drafts.delete(agent);
  attachments.delete(agent);
  showAttachments(agent, c);
  c.send.disabled = true;
  const url = first ? 'session?' + new URLSearchParams({action: 'new', workspace: first.workspace, lead: first.lead})
    : 'agent?' + new URLSearchParams({action: 'input', id: agent});
  if (first) { first.sending = true; render(); }
  const sent = await post(url, JSON.stringify({text, images}));
  if (first) {
    first.sending = false;
    if (unsent !== first) return;
    if (sent !== null) {
      const created = JSON.parse(sent);
      if (drafts.has(agent)) drafts.set(created.lead, drafts.get(agent));
      if (attachments.has(agent)) attachments.set(created.lead, attachments.get(agent));
      select(created.session);
      return;
    }
    render();
  }
  if (sent !== null) return;
  if (!c.field.value) {
    c.field.value = text;
    if (text) drafts.set(agent, text);
  }
  if (!attachments.has(agent) && images.length) attachments.set(agent, images);
  showAttachments(agent, c);
}

// The same activity indicator appears in tabs and worker previews.
function agentStatus(a) {
  return a.activity === 'exited' ? '<span title="Exited" class="block size-2 shrink-0 rounded-full bg-red-400"></span>'
    : a.attention ? '<span title="Waiting on you" class="block size-2 shrink-0 rounded-full bg-amber-400"></span>'
    : a.activity === 'busy' ? '<span role="img" title="Busy" class="icon icon-loading block size-3.5 text-neutral-400"></span>'
    : '';
}

// post sends an action to the server, with an optional body, and returns its
// response text, or null if the server refused, after showing why.
async function post(action, body) {
  const res = await fetch(action, {method: 'POST', body});
  const text = await res.text();
  if (!res.ok) alert(text);
  return res.ok ? text : null;
}

// Clicking a session selects it. Clicking an action asks its question, if
// any, then posts it to the server and shows why it refused.
document.body.addEventListener('click', async e => {
  closeMenu();
  const leadButton = e.target.closest('[data-leads]');
  const moreButton = e.target.closest('[data-more]');
  const action = e.target.closest('[data-action]');
  const row = e.target.closest('[data-select]');
  const w = data.find(w => w.id === moreButton?.dataset.more);
  if (leadButton) {
    await pickLead(leadButton);
  } else if (w) {
    const rect = moreButton.getBoundingClientRect();
    showMenu(workspaceItems(w), rect.left, rect.bottom);
    menu.querySelector('[role="menuitem"]')?.focus();
  } else if (action) {
    if (action.dataset.question && !confirm(action.dataset.question)) return;
    post(action.dataset.action);
  } else if (row) {
    select(row.dataset.select);
  }
});

// Right-clicking a workspace or session opens its context menu at the pointer.
// A click, Escape, or leaving the page closes it.
const menu = $('menu');
const menuItemClass = 'mx-1 block w-[calc(100%-8px)] rounded-[3px] px-6 py-1 text-left text-neutral-300 outline-none hover:bg-[#04395e] hover:text-white focus-visible:bg-[#04395e] focus-visible:text-white';

let menuRequest = 0;

function closeMenu() {
  menu.hidden = true;
  menu.onclick = null;
  menuRequest++;
}

function placeMenu(x, y) {
  menu.hidden = false;
  menu.style.left = Math.max(0, Math.min(x, innerWidth - menu.offsetWidth)) + 'px';
  menu.style.top = Math.max(0, Math.min(y, innerHeight - menu.offsetHeight)) + 'px';
}

// The lead picker is a menu under the workspace's New Session button, listing
// each lead by its description. Picking one opens an unsent new session with
// that lead, replacing any other unsent session.
async function pickLead(button) {
  const request = ++menuRequest, workspace = button.dataset.leads;
  const rect = button.getBoundingClientRect();
  const res = await fetch('leads');
  if (!res.ok) { alert(await res.text()); return; }
  const leads = await res.json();
  if (request !== menuRequest) return;
  menu.innerHTML = leads.map(p => `<button type="button" role="menuitem" data-lead="${escape(p.name)}" class="${menuItemClass} whitespace-nowrap">${escape(p.description)}</button>`).join('');
  menu.onclick = e => {
    const item = e.target.closest('[data-lead]');
    if (!item) return;
    closeMenu();
    const profile = leads.find(p => p.name === item.dataset.lead);
    discardUnsent();
    pending = null;
    selected = null;
    unsent = {workspace, lead: profile.name, harness: profile.harness, model: profile.model, effort: profile.effort};
    changed();
  };
  placeMenu(rect.left, rect.bottom);
  menu.querySelector('[role="menuitem"]')?.focus();
}

// Arrow keys move between a menu's items.
menu.addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const items = [...menu.querySelectorAll('[role="menuitem"]')];
  const i = items.indexOf(document.activeElement);
  items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length]?.focus();
});

// A session's menu starts or stops it and deletes it; a workspace's deletes it.
// A workspace's menu also opens under its More Actions button.
const workspaceItems = w => [{label: 'Delete Workspace', action: 'workspace?' + new URLSearchParams({action: 'delete', id: w.id}), question: `Delete workspace ${w.name}?`}];

function showMenu(items, x, y) {
  menu.innerHTML = items.map(i => `<button type="button" role="menuitem" data-action="${escape(i.action)}" ${i.question ? `data-question="${escape(i.question)}"` : ''}
    class="${menuItemClass}">${escape(i.label)}</button>`).join('');
  placeMenu(x, y);
}

document.addEventListener('contextmenu', e => {
  closeMenu();
  const row = e.target.closest('[data-session]'), header = e.target.closest('[data-workspace]');
  const s = sessions().find(s => s.id === row?.dataset.session);
  const w = data.find(w => w.id === header?.dataset.workspace);
  let items;
  if (s) {
    const action = name => 'session?' + new URLSearchParams({action: name, id: s.id});
    const live = s.running && !failed(s);
    items = [live ? {label: 'Stop Session', action: action('stop')} : {label: 'Start Session', action: action('start')},
      {label: 'Delete Session', action: action('delete'), question: `Delete session ${s.title}?`}];
  } else if (w) {
    items = workspaceItems(w);
  } else {
    return;
  }
  e.preventDefault();
  showMenu(items, e.clientX, e.clientY);
});
addEventListener('pointerdown', e => {
  if (!menu.contains(e.target)) closeMenu();
}, true);
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
});
addEventListener('blur', closeMenu);

$('add-workspace').onclick = () => post('workspace?action=new');

// The panel shows the session's shell, which the app starts when the panel
// first shows and keeps running until the shell exits or the session stops.
// Closing the panel leaves it running.
let panelOpen = false, shell = null;

// editing gives the bytes Ghostty sends for the macOS text editing shortcuts,
// which xterm.js leaves to the browser.
function editing(e) {
  const mods = (e.metaKey ? 'cmd+' : '') + (e.altKey ? 'alt+' : '') + (e.ctrlKey ? 'ctrl+' : '') + (e.shiftKey ? 'shift+' : '');
  return {
    'cmd+Backspace': '\x15',
    'cmd+ArrowLeft': '\x01',
    'cmd+ArrowRight': '\x05',
    'alt+ArrowLeft': '\x1bb',
    'alt+ArrowRight': '\x1bf',
  }[mods + e.key];
}

function connectShell() {
  if (!attached || shell || panel.hidden) return;
  const box = document.createElement('div');
  box.className = 'h-full';
  panel.append(box);
  const {term, fit} = createTerminal(box);
  fit.fit();
  const mine = shell = {session: attached, term, fit, box, socket: null, connected: false, exited: false};
  const send = bytes => { if (mine.socket?.readyState === WebSocket.OPEN) mine.socket.send(bytes); };
  term.attachCustomKeyEventHandler(e => {
    const text = e.type === 'keydown' && editing(e);
    if (!text) return true;
    e.preventDefault();
    send(new TextEncoder().encode(text));
    return false;
  });
  term.onData(data => send(new TextEncoder().encode(data)));
  term.onBinary(data => send(Uint8Array.from(data, c => c.charCodeAt(0))));
  term.onResize(({cols, rows}) => { if (mine.socket?.readyState === WebSocket.OPEN) mine.socket.send(JSON.stringify({cols, rows})); });
  openShellSocket(mine);
  term.focus();
}

// The app replays the shell's recent output on every connection, so a
// reconnect starts the terminal over.
function openShellSocket(mine) {
  const {cols, rows} = mine.term;
  const socket = mine.socket = connect('terminal?' + new URLSearchParams({session: mine.session, cols, rows}));
  socket.binaryType = 'arraybuffer';
  socket.onopen = () => { mine.connected = true; mine.term.reset(); };
  socket.onmessage = e => {
    if (typeof e.data === 'string') mine.exited = true;
    else mine.term.write(new Uint8Array(e.data));
  };
  socket.onclose = () => {
    if (shell !== mine) return;
    if (mine.exited || !mine.connected) {
      // As in VS Code, the panel closes when its terminal exits.
      closeShell();
      setPanel(false);
    } else {
      setTimeout(() => { if (shell === mine) openShellSocket(mine); }, 1000);
    }
  };
}

// closeShell drops the page's connection; the shell itself keeps running.
function closeShell() {
  if (!shell) return;
  const mine = shell;
  shell = null;
  mine.socket.close();
  mine.term.dispose();
  mine.box.remove();
}

// The shell's terminal fills the panel.
function fitPanel() {
  if (!shell || panel.hidden) return;
  shell.fit.fit();
}
new ResizeObserver(fitPanel).observe(panel);

function setPanel(open) {
  panelOpen = open;
  panel.hidden = $('panel-sash').hidden = !open;
  const button = $('toggle-panel');
  button.setAttribute('aria-pressed', open);
  button.title = open ? 'Hide Panel' : 'Show Panel';
  button.firstElementChild.className = `icon ${open ? 'icon-layout-panel' : 'icon-layout-panel-off'} size-4`;
  if (open) {
    connectShell();
    fitPanel();
    shell?.term.focus();
  }
}
$('toggle-panel').onclick = () => setPanel(!panelOpen);

$('toggle-sidebar').onclick = () => {
  const open = sidebar.hidden;
  sidebar.hidden = $('sidebar-sash').hidden = !open;
  $('toggle-sidebar').setAttribute('aria-pressed', open);
  $('toggle-sidebar').title = open ? 'Hide Left Panel' : 'Show Left Panel';
  $('toggle-sidebar').firstElementChild.className = `icon ${open ? 'icon-layout-sidebar-left' : 'icon-layout-sidebar-left-off'} size-4`;
};

$('toggle-right-panel').onclick = () => {
  const open = rightPanel.hidden;
  rightPanel.hidden = !open;
  const button = $('toggle-right-panel');
  button.setAttribute('aria-expanded', open);
  button.title = open ? 'Hide Right Panel' : 'Show Right Panel';
  button.setAttribute('aria-label', button.title);
  button.firstElementChild.className = `icon ${open ? 'icon-layout-sidebar-left' : 'icon-layout-sidebar-left-off'} size-4 rotate-180`;
};

const rightTabs = [...$('right-panel-tabs').querySelectorAll('[role="tab"]')];
function selectRightTab(tab) {
  for (const button of rightTabs) {
    const selected = button === tab;
    button.setAttribute('aria-selected', selected);
    button.tabIndex = selected ? 0 : -1;
    $(button.getAttribute('aria-controls')).hidden = !selected;
  }
}
for (const [index, tab] of rightTabs.entries()) {
  tab.onclick = () => selectRightTab(tab);
  tab.onkeydown = e => {
    let next;
    if (e.key === 'ArrowRight') next = (index + 1) % rightTabs.length;
    else if (e.key === 'ArrowLeft') next = (index + rightTabs.length - 1) % rightTabs.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = rightTabs.length - 1;
    else return;
    e.preventDefault();
    selectRightTab(rightTabs[next]);
    rightTabs[next].focus();
  };
}

// drag follows the pointer from a sash until release.
let dragging = false;
function drag(sash, move, release, start) {
  sash.onpointerdown = e => {
    if (e.button !== 0 || start?.(e) === false) return;
    e.preventDefault();
    dragging = true;
    sash.classList.add('dragging');
    const up = () => {
      dragging = false;
      sash.classList.remove('dragging');
      removeEventListener('pointermove', move, true);
      removeEventListener('pointerup', up, true);
      removeEventListener('pointercancel', up, true);
      release?.();
    };
    addEventListener('pointermove', move, true);
    addEventListener('pointerup', up, true);
    addEventListener('pointercancel', up, true);
  };
}
drag($('sidebar-sash'), e => sidebar.style.width = Math.max(160, Math.min(e.clientX, innerWidth / 2)) + 'px');
drag(leadSash, e => {
  const rect = transcripts.getBoundingClientRect();
  const ratio = Math.max(0.15, Math.min(0.85, (e.clientX - rect.left) / rect.width));
  leadColumn.style.flex = `${ratio} 1 0%`;
  tabArea.style.flex = `${1 - ratio} 1 0%`;
});
drag($('panel-sash'), e => panel.style.height = Math.max(40, Math.min(panel.getBoundingClientRect().bottom - e.clientY, innerHeight * 0.8)) + 'px');
// Files outside a pane would open in the browser. Tabs outside their area
// could insert their ID into the lead's input. Refuse both kinds of drop.
for (const type of ['dragover', 'drop']) {
  addEventListener(type, e => {
    if (tabContainer?.dragged && !tabArea.contains(e.target)) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'none';
      return;
    }
    if (!hasFiles(e) || e.defaultPrevented) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'none';
  });
}
hypercube($('hypercube'));
watch();
</script>
</body>
