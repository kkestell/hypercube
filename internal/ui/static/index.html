<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<title>Hypercube</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="ui.css">
</head>
<body class="h-full overflow-hidden bg-[#1e1e1e] text-sm text-neutral-300">
<div class="flex h-full flex-col">
<header class="flex h-9 shrink-0 items-center gap-1 border-b border-[#2b2b2b] bg-[#323233] px-2">
  <button type="button" id="toggle-sidebar" title="Hide Left Panel" aria-pressed="true" class="ml-auto flex rounded p-1 text-neutral-400 hover:bg-neutral-700 hover:text-neutral-100">
    <span class="icon icon-layout-sidebar-left size-4"></span>
  </button>
  <button type="button" id="toggle-panel" title="Show Panel" aria-pressed="false" class="flex rounded p-1 text-neutral-400 hover:bg-neutral-700 hover:text-neutral-100">
    <span class="icon icon-layout-panel-off size-4"></span>
  </button>
</header>

<div class="flex min-h-0 flex-1">
  <aside id="sidebar" class="flex w-[260px] shrink-0 flex-col bg-[#252526]">
    <div class="flex h-[38px] shrink-0 items-center justify-between px-2 text-[11px] font-semibold tracking-wide text-neutral-400 uppercase">
      Workspaces
      <button type="button" id="add-workspace" title="New Workspace" class="flex size-[22px] items-center justify-center rounded text-neutral-300 hover:bg-[#5a5d5e50]"><span class="icon icon-add size-4"></span></button>
    </div>
    <ul id="sessions" class="min-h-0 flex-1 overflow-auto"></ul>
  </aside>
  <div id="sidebar-sash" class="sash"></div>
  <div class="flex min-w-0 flex-1 flex-col">
    <div id="center" class="flex min-h-0 flex-1 bg-[#181818]">
      <div id="lead" class="flex min-w-0 flex-1 flex-col overflow-hidden p-3"></div>
      <div id="split" class="sash" hidden></div>
      <div id="workers" class="flex min-w-0 flex-1 flex-col gap-3 overflow-y-auto p-3" hidden></div>
    </div>
    <div id="panel-sash" class="sash" aria-orientation="horizontal" hidden></div>
    <div id="panel" class="h-[240px] max-h-[80vh] shrink-0 overflow-hidden pt-1 pl-2" hidden></div>
  </div>
</div>
</div>

<div id="menu" role="menu" hidden class="fixed z-50 max-h-screen min-w-[160px] max-w-full overflow-auto rounded-[5px] border border-[#454545] bg-[#252526] py-1 text-[13px] shadow-lg shadow-black/50"></div>
<div id="probe" class="invisible absolute"></div>
<script src="xterm.js"></script>
<script src="addon-webgl.js"></script>
<script>
// The page shows Hypercube's data, streamed from the app, and the selected
// session's terminals, through a tmux control-mode client attached to that
// session's tmux session. The sidebar lists each workspace's sessions under a
// row naming the workspace. The selected session's lead fills the left, and
// its workers are cards on the right, each showing either a summary or its
// terminal. tmux sizes the panes; the page asks for the sizes its layout has
// room for.

const fontFamily = 'Menlo, Monaco, "Courier New", monospace', fontSize = 13;
const theme = {background: '#1e1e1e'};
// tmux answers programs' color queries with these, as style in tmux.go does
// for agents' windows.
const terminalStyle = 'fg=#ffffff,bg=#1e1e1e';
// The WebGL renderer draws box and block characters to fill their cells
// exactly, as terminals do. The probe uses it too, since it sizes cells to
// whole device pixels.
function webgl(term) {
  const addon = new WebglAddon.WebglAddon();
  addon.onContextLoss(() => addon.dispose());
  term.loadAddon(addon);
}

const probe = new Terminal({fontFamily, fontSize});
probe.open(document.getElementById('probe'));
webgl(probe);
const cell = probe._core._renderService.dimensions.css.cell;

const $ = id => document.getElementById(id);
const center = $('center'), lead = $('lead'), split = $('split'), workers = $('workers');
const sessionList = $('sessions'), sidebar = $('sidebar'), panel = $('panel');

// Pixels beside a terminal: its panel's padding, its card's border, and its own
// padding.
const cardX = 24 + 2 + 16;

let source, client, session, outbox, sending, callbacks, block, terms = new Map(), shown, activePane;
// data is the app's latest snapshot, selected is the selected session's ID,
// and attached is the running session the terminals belong to.
// dead is a session marked running whose terminals could not be reached, as
// after a failed start; it can be started again. generation counts attachments.
// pending is a session to select once the data lists it.
let data = [], selected = decodeURIComponent(location.hash.slice(1)), pending = null, attached = null, dead = null, generation = 0;

const sessions = () => data.flatMap(w => w.sessions);
const current = () => sessions().find(s => s.id === selected);

function watch() {
  const stream = new EventSource('state');
  stream.onmessage = e => { data = JSON.parse(e.data); changed(); };
  stream.onerror = () => { stream.close(); setTimeout(watch, 1000); };
}

// changed shows new data: the title, the sidebar, and the selected session,
// attaching to its terminals when it runs.
function changed() {
  const all = sessions();
  if (pending && all.some(s => s.id === pending)) { selected = pending; pending = null; }
  if (!current()) selected = (all.find(s => s.running) ?? all[0])?.id ?? '';
  if (decodeURIComponent(location.hash.slice(1)) !== selected) history.replaceState(null, '', selected ? '#' + encodeURIComponent(selected) : location.pathname);
  const s = current();
  const waiting = all.filter(s => s.running).reduce((n, s) => n + s.agents.filter(a => a.attention).length, 0);
  const workspace = data.find(w => w.sessions.includes(s));
  document.title = (waiting ? `(${waiting}) ` : '') + [s?.title, workspace?.name, 'Hypercube'].filter(Boolean).join(' — ');
  renderSidebar();
  const want = s?.running ? s.id : null;
  if (want !== attached) attach(want);
  else refresh();
  if (s?.unseen && document.visibilityState === 'visible') fetch('session?' + new URLSearchParams({action: 'seen', id: s.id}), {method: 'POST'});
}
document.addEventListener('visibilitychange', changed);

// Selecting a stopped session starts it. A new session's ID can arrive before
// the state that lists it, so the selection waits for that state.
function select(id) {
  if (!sessions().some(s => s.id === id)) { pending = id; return; }
  pending = null;
  selected = id;
  changed();
  const s = current();
  if (s && (!s.running || dead === s.id)) post('session?' + new URLSearchParams({action: 'start', id}));
}

function attach(id) {
  source?.close();
  source = client = null;
  attached = id;
  generation++;
  outbox = []; sending = false; callbacks = []; block = null; size = sent = ''; refreshing = again = false; activePane = null;
  applying = reapply = false; pendingLayouts.clear(); shell = null; creating = false; shown = null;
  for (const term of terms.values()) term.dispose();
  terms = new Map();
  lead.replaceChildren();
  workers.replaceChildren();
  panel.replaceChildren();
  cards.clear();
  split.hidden = workers.hidden = true;
  if (!id) return;
  source = new EventSource('events?session=' + encodeURIComponent(id));
  let reached = false;
  source.addEventListener('id', e => {
    client = e.data; reached = true;
    if (dead === id) dead = null;
    refresh();
  });
  source.onmessage = e => received(Uint8Array.from(atob(e.data), c => c.charCodeAt(0)));
  source.onerror = () => {
    source.close(); client = null;
    if (!reached) dead = id;
    setTimeout(() => { if (attached === id) attach(id); }, 1000);
  };
}

// Commands go out in order, batched while a request is in flight. Commands
// sent together reach tmux together, so it resizes each pane once for all of
// them. Each command's reply block comes back in the same order.
function send(command, callback) {
  callbacks.push(callback);
  outbox.push(command);
  queueMicrotask(flush);
}

async function flush() {
  if (sending || !outbox.length || !client) return;
  sending = true;
  const mine = generation;
  const body = outbox.join('\n');
  outbox = [];
  try { await fetch('send?id=' + client, {method: 'POST', body}); } catch {}
  // A new attachment has reset the queue and may already be sending.
  if (mine !== generation) return;
  sending = false;
  flush();
}

const decoder = new TextDecoder();
const structural = /^%(layout-change|window-add|window-close|unlinked-window-(add|close)|session-window-changed|window-pane-changed)( |$)/;

function received(bytes) {
  if (block) {
    const text = decoder.decode(bytes);
    if (text === '%end ' + block.id || text === '%error ' + block.id) {
      const callback = block.own && callbacks.shift();
      if (callback) callback(block.lines, text.startsWith('%error'));
      block = null;
    } else {
      block.lines.push(text);
    }
    return;
  }
  if (bytes.length > 8 && decoder.decode(bytes.subarray(0, 8)) === '%output ') {
    const space = bytes.indexOf(32, 8);
    const term = terms.get(decoder.decode(bytes.subarray(8, space)));
    resizeTerminals();
    if (term && !term.loading) term.write(unescape(bytes.subarray(space + 1)));
    return;
  }
  const text = decoder.decode(bytes);
  if (text.startsWith('%begin ')) {
    const id = text.slice(7);
    block = {id, own: id.endsWith(' 1'), lines: []};
  } else if (text.startsWith('%session-changed ')) {
    session = text.split(' ')[1];
    refresh();
  } else if (structural.test(text)) {
    const change = text.match(/^%layout-change (\S+) (\S+)/);
    if (change) {
      pendingLayouts.set(change[1], change[2]);
      requestAnimationFrame(resizeTerminals);
    }
    refresh();
  }
}

// A pane's program redraws for its new size as soon as tmux resizes it, so
// its terminal takes the size tmux announced before writing more output.
// Commands sent together can announce several layouts for a window; only the
// last counts.
const pendingLayouts = new Map();
function resizeTerminals() {
  for (const layout of pendingLayouts.values()) {
    for (const [, w, h, id] of layout.matchAll(/(\d+)x(\d+),\d+,\d+,(\d+)/g)) {
      const term = terms.get('%' + id);
      if (term && (term.cols !== +w || term.rows !== +h)) term.resize(+w, +h);
    }
  }
  pendingLayouts.clear();
}

// tmux escapes control characters and backslashes in pane output as \ooo.
function unescape(bytes) {
  const out = new Uint8Array(bytes.length);
  let n = 0;
  for (let i = 0; i < bytes.length; i++) {
    if (bytes[i] === 92 && i + 3 < bytes.length) {
      out[n++] = (bytes[i + 1] - 48) * 64 + (bytes[i + 2] - 48) * 8 + (bytes[i + 3] - 48);
      i += 3;
    } else {
      out[n++] = bytes[i];
    }
  }
  return out.subarray(0, n);
}

// One refresh at a time; notifications during one schedule another. A pane's
// death sends no notification, so a timer catches it.
let refreshing = false, again = false;
setInterval(refresh, 1000);

function refresh() {
  if (!client) return;
  if (refreshing) { again = true; return; }
  refreshing = true;
  const rows = (lines, keys) => lines.map(line => {
    const values = line.split('\t'), row = {};
    keys.forEach((key, i) => row[key] = values[i]);
    return row;
  });
  let wins;
  send(`list-windows -F '#{window_id}\t#{window_active}\t#{window_layout}\t#{@hypercube_terminal}\t#{pane_id}'`,
    lines => wins = rows(lines, ['id', 'active', 'layout', 'terminal', 'pane']));
  send(`list-panes -F '#{pane_id}\t#{pane_left}\t#{pane_top}\t#{pane_width}\t#{pane_height}\t#{pane_active}\t#{pane_dead}\t#{pane_dead_status}\t#{@hypercube_agent}'`,
    (lines, error) => {
      refreshing = false;
      if (!error && wins) render(wins, rows(lines, ['id', 'left', 'top', 'width', 'height', 'active', 'dead', 'status', 'agent']));
      if (again) { again = false; refresh(); }
    });
}

const names = agents => agents.map(a => a.name).join(', ');

const escape = text => text.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

// A worker card's open state is kept per agent.
const openKey = agent => 'hypercube-open:' + agent;

// update replaces an element's children only when they change. A click is lost
// when the element under the pointer is replaced between press and release.
// Parsing the new HTML first compares it as the page would serialize it.
function update(parent, html) {
  const next = document.createElement('template');
  next.innerHTML = html;
  if (parent.innerHTML !== next.innerHTML) parent.replaceChildren(next.content);
}

function render(wins, list) {
  const win = wins.find(w => w.active === '1');
  renderPanel(wins.find(w => w.terminal));
  // tmux can select the terminal's window when a client attaches.
  if (win?.terminal) {
    const other = wins.find(w => !w.terminal);
    if (other) send(`select-window -t '${other.id}'`);
    return;
  }

  const agents = new Map((current()?.agents ?? []).map(a => [a.id, a]));
  for (const p of list) {
    p.agent = agents.get(p.agent) ?? {id: p.agent, name: ''};
    p.open = localStorage.getItem(openKey(p.agent.id)) === '1';
  }
  for (const p of list) for (const key of ['left', 'top', 'width', 'height']) p[key] = +p[key];
  const [leader] = list.filter(p => p.left === 0);
  const stacked = list.filter(p => p.left > 0).sort((a, b) => a.top - b.top);
  if (win?.id !== shown?.window) leadWidth = null;
  shown = {window: win?.id, leader, stacked, layout: win?.layout.slice(5)};

  // Each pane's terminal matches the pane's size and sits in its agent's card.
  // The lead's card always shows its terminal.
  if (leader) leader.open = true;
  for (const p of list) {
    let term = terms.get(p.id);
    if (!term) term = open(p.id, p.width, p.height);
    else if (term.cols !== p.width || term.rows !== p.height) term.resize(p.width, p.height);
    const parent = card(p).slot;
    if (term.box.parentElement !== parent) parent.append(term.box);
    // The terminal takes the focus when tmux selects another pane.
    if (p.active === '1' && p.id !== activePane && p.open) { activePane = p.id; term.focus(); }
  }
  for (const [id, term] of terms) {
    if (id !== shell?.pane && !list.some(p => p.id === id)) { term.box.remove(); term.dispose(); terms.delete(id); }
  }
  for (const [id, c] of cards) {
    if (!list.some(p => p.id === id)) { c.element.remove(); cards.delete(id); }
  }
  // Moving a card that is already in place would blur its terminal.
  if (leader && card(leader).element.parentElement !== lead) lead.append(card(leader).element);
  stacked.forEach((p, i) => {
    const element = card(p).element;
    if (workers.children[i] !== element) workers.insertBefore(element, workers.children[i] ?? null);
  });

  const any = stacked.length > 0;
  split.hidden = workers.hidden = !any;
  lead.classList.toggle('flex-1', !any);
  lead.classList.toggle('shrink-0', any);
  // The lead keeps a width being dragged until tmux has applied it.
  if (leadWidth === leader?.width && !dragging) leadWidth = null;
  lead.style.width = any && leader ? (leadWidth ?? leader.width) * cell.width + cardX + 'px' : '';

  // A new or removed worker changes the desired layout.
  apply();
}

// The sidebar lists each workspace's sessions below a row that collapses
// them. It stays as it is while a session is being renamed.
let renaming = false;
const collapsed = new Set();

// A busy workspace shows a spinner in place of its folder icon, and a busy
// session in the same column.
const spinner = title => `<span role="img" title="${escape(title)}" class="icon icon-loading size-4 text-neutral-400"></span>`;

function renderSidebar() {
  if (renaming) return;
  update(sessionList, data.map(w => {
    const open = !collapsed.has(w.id);
    const busy = w.sessions.some(s => s.running && s.agents.some(a => a.activity === 'busy'));
    return `<li class="group flex items-center gap-1 pr-2 hover:bg-[#2a2d2e]" data-workspace="${w.id}" title="${escape(w.path)}">
        <button type="button" data-collapse="${w.id}" aria-expanded="${open}" class="flex min-w-0 flex-1 items-center gap-2 py-1.5 pl-2 text-left text-neutral-400">
          ${busy ? spinner('Busy') : `<span class="icon ${open ? 'icon-folder-opened' : 'icon-folder'} size-4"></span>`}<span class="truncate">${escape(w.name)}</span>
        </button>
        <button type="button" title="New Session" aria-haspopup="menu" class="invisible flex size-[22px] group-hover:visible group-focus-within:visible items-center justify-center rounded text-neutral-300 hover:bg-[#5a5d5e50]"
          data-leads="${w.id}"><span class="icon icon-add size-4"></span></button>
      </li>` +
      (open ? w.sessions.map(sessionRow).join('') : '');
  }).join(''));
}

sessionList.addEventListener('click', e => {
  const header = e.target.closest('[data-collapse]');
  if (!header) return;
  const id = header.dataset.collapse;
  if (!collapsed.delete(id)) collapsed.add(id);
  renderSidebar();
});

// Double-clicking a session replaces it with a field for its new title. Enter
// or leaving the field saves the title, and Escape cancels.
sessionList.addEventListener('dblclick', e => {
  const row = e.target.closest('[data-session]');
  const s = sessions().find(s => s.id === row?.dataset.session);
  if (!s) return;
  renaming = true;
  const input = document.createElement('input');
  input.value = s.title;
  input.className = 'my-1 mr-1 ml-7 min-w-0 flex-1 border border-sky-500 bg-[#3c3c3c] px-1 py-0.5 text-neutral-100 outline-none';
  row.replaceWith(input);
  input.focus();
  input.select();
  const finish = save => {
    if (!renaming) return;
    renaming = false;
    const title = input.value.trim();
    if (save && title && title !== s.title) {
      post('session?' + new URLSearchParams({action: 'rename', id: s.id, title}));
      s.title = title;
    }
    sessionList.replaceChildren();
    renderSidebar();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') finish(true);
    else if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
});

// A stopped session's row is dimmed. Busy and waiting agents show only while
// the session runs.
function sessionRow(s) {
  const active = s.id === selected;
  const busy = s.running ? names(s.agents.filter(a => a.activity === 'busy')) : '';
  const waiting = s.running ? names(s.agents.filter(a => a.attention)) : '';
  const text = !s.running ? 'text-neutral-500' : active ? 'text-neutral-100' : '';
  return `<li class="${active ? 'bg-[#37373d]' : 'hover:bg-[#2a2d2e]'} ${text}" data-session="${s.id}">
    <div class="flex items-center gap-1 pr-2">
      <button type="button" data-select="${s.id}" class="flex min-w-0 flex-1 items-center gap-2 py-1.5 pl-2 text-left">
        ${busy ? spinner('Busy: ' + busy) : '<span class="size-4 shrink-0"></span>'}
        <span class="flex min-w-0 items-center gap-1.5">
          <span class="truncate">${escape(s.title)}</span>
          ${waiting ? `<span title="Waiting on you: ${escape(waiting)}" class="size-2 shrink-0 rounded-full bg-amber-400"></span>` : ''}
          ${s.unseen && !active ? '<span title="New reply" class="size-2 shrink-0 rounded-full bg-sky-400"></span>' : ''}
        </span>
      </button>
    </div>
  </li>`;
}

// Token counts read as 845, 84k, 1.2M.
function tokens(n) {
  if (n < 1000) return String(n);
  const [scale, unit] = n < 1e6 ? [1e3, 'k'] : [1e6, 'M'];
  return (n < 10 * scale ? Math.floor(n / scale * 10) / 10 : Math.floor(n / scale)) + unit;
}

// A report's age reads as now, 3m, 2h, 1d.
function age(ms) {
  const minutes = Math.floor((Date.now() - ms) / 60000);
  if (minutes < 1) return 'now';
  if (minutes < 60) return minutes + 'm';
  return minutes < 1440 ? Math.floor(minutes / 60) + 'h' : Math.floor(minutes / 1440) + 'd';
}

// The summary is the worker's report of what it is doing and a footer with its
// context use, cost, and the report's age. Each part shows once it is known.
function summary(a) {
  const {context = 0, window = 0, cost = 0} = a.usage ?? {};
  const radius = 6, circumference = 2 * Math.PI * radius;
  const ring = window ? `<svg viewBox="0 0 16 16" class="size-3.5 shrink-0 -rotate-90">
        <circle cx="8" cy="8" r="${radius}" fill="none" stroke="currentColor" stroke-width="2" class="text-neutral-700"/>
        <circle cx="8" cy="8" r="${radius}" fill="none" stroke="currentColor" stroke-width="2" class="text-sky-400"
          stroke-dasharray="${circumference}" stroke-dashoffset="${(circumference * (1 - Math.min(1, context / window))).toFixed(2)}"/>
      </svg>` : '';
  const contextUse = window ? `<span class="flex items-center gap-1.5 whitespace-nowrap">${ring}${tokens(context)} / ${tokens(window)}</span>` : '';
  const spent = cost ? `<span class="whitespace-nowrap">${cost < 0.01 ? '<$0.01' : `$${cost.toFixed(2)}`}</span>` : '';
  const footer = contextUse || spent || a.status ? `<footer class="flex items-center gap-3 text-neutral-500">
      ${contextUse}${spent}
      ${a.status ? `<span class="ml-auto shrink-0">${age(a.statusAt)}</span>` : ''}
    </footer>` : '';
  return (a.status ? `<p class="line-clamp-4 break-words text-neutral-300">${escape(a.status)}</p>` : '') + footer;
}

// An agent's card shows its name, status, and summary, or its name, status,
// and terminal. The lead's card has no summary. Cards persist so their
// terminals stay attached.
const cards = new Map();

function card(p) {
  let c = cards.get(p.id);
  if (!c) {
    const element = document.createElement('article');
    element.dataset.pane = p.id;
    element.innerHTML = `<header class="flex items-center gap-2">
        <span class="name min-w-0 truncate text-left text-sm text-neutral-100"></span>
        <span class="status ml-auto shrink-0"></span>
        <button type="button" class="toggle flex rounded p-0.5 text-neutral-400 hover:bg-neutral-700 hover:text-neutral-100 aria-pressed:bg-neutral-700 aria-pressed:text-neutral-100">
          <span class="icon icon-terminal size-3.5"></span>
        </button>
      </header>
      <div class="summary flex flex-col gap-2"></div>
      <div class="slot -mx-3 mt-1 -mb-3 flex min-h-0 flex-1 flex-col justify-end overflow-hidden rounded-b-md border-t border-[#2b2b2b] bg-[#1e1e1e] px-2 py-1"></div>`;
    const q = name => element.querySelector('.' + name);
    c = {element, name: q('name'), status: q('status'), toggle: q('toggle'), summary: q('summary'), slot: q('slot')};
    cards.set(p.id, c);
  }
  const status = p.dead === '1' ? `<span title="Exited with status ${escape(p.status)}" class="block size-2 rounded-full bg-red-400"></span>`
    : p.agent.attention ? '<span title="Waiting on you" class="block size-2 rounded-full bg-amber-400"></span>'
    : p.agent.activity === 'busy' ? '<span role="img" title="Busy" class="icon icon-loading block size-3.5 text-neutral-400"></span>'
    : '';
  const open = p.open;
  const className = `relative flex flex-col gap-2 rounded-md border bg-[#252526] p-3 text-xs ${open ? 'min-h-0 flex-1 basis-0' : 'shrink-0 cursor-pointer'} ${
    p.agent.attention ? 'border-amber-400' : 'border-[#2b2b2b]'}`;
  if (c.element.className !== className) c.element.className = className;
  if (c.name.textContent !== p.agent.name) c.name.textContent = p.agent.name;
  update(c.status, status);
  c.toggle.hidden = p === shown.leader;
  c.toggle.setAttribute('aria-pressed', open);
  c.toggle.title = open ? 'Show Summary' : 'Show Terminal';
  const html = summary(p.agent);
  update(c.summary, html);
  c.summary.hidden = open || !html;
  c.slot.hidden = !open;
  return c;
}

// Clicking a card in summary shows its terminal; its terminal button switches
// back and forth.
workers.onclick = e => {
  const element = e.target.closest('[data-pane]');
  const p = shown?.stacked.find(p => p.id === element?.dataset.pane);
  if (!p || p.open && !e.target.closest('.toggle')) return;
  p.open = !p.open;
  if (p.open) localStorage.setItem(openKey(p.agent.id), '1');
  else localStorage.removeItem(openKey(p.agent.id));
  card(p);
  apply();
  if (p.open) terms.get(p.id).focus();
};

// The page lays out its panels, then gives tmux the window and pane sizes
// whose terminals fit them, in one layout. The lead fills the window's
// height. Its width is the lead's columns, tmux's one-column divider, and the
// workers' columns, which fit the workers panel less its gutter, padding, and
// card borders. A worker in summary gets one row, and the last in summary
// takes the rest. Open terminals get the rows their cards have room for; with
// every card open, they share all the rows, and each card shows the bottom of
// its terminal.
function desired() {
  const {leader, stacked} = shown, n = stacked.length;
  const gutter = n ? workers.offsetWidth - workers.clientWidth : 0;
  const cols = Math.max(n ? 42 : 1, Math.floor((center.clientWidth - cardX - (n ? 1 + cardX + gutter : 0)) / cell.width) + (n ? 1 : 0));
  const rows = Math.max(2 * n, 2, Math.floor((cards.get(leader.id).slot.clientHeight - 8) / cell.height));
  const id = p => p.id.slice(1);
  if (!n) return {size: cols + 'x' + rows, layout: `${cols}x${rows},0,0,${id(leader)}`};

  const leadCols = Math.max(20, Math.min(cols - 21, leadWidth ?? leader.width));
  const x = leadCols + 1, w = cols - x, free = rows - (n - 1);
  const open = stacked.filter(p => p.open);
  let heights;
  if (open.length === n) {
    const share = Math.floor(free / n);
    heights = stacked.map((p, i) => i === n - 1 ? free - share * (n - 1) : share);
  } else {
    const fit = p => Math.max(1, Math.floor((cards.get(p.id).slot.clientHeight - 8) / cell.height));
    heights = stacked.map(p => p.open ? fit(p) : 1);
    // Open terminals give up rows when the summaries have none left.
    const shrinkable = () => heights.some((h, i) => stacked[i].open && h > 1);
    for (let over = heights.reduce((a, b) => a + b, 0) - free, i = 0; over > 0 && shrinkable(); i = (i + 1) % n) {
      if (stacked[i].open && heights[i] > 1) { heights[i]--; over--; }
    }
    heights[stacked.findLastIndex(p => !p.open)] += free - heights.reduce((a, b) => a + b, 0);
  }
  let y = 0;
  const cells = stacked.map((p, i) => {
    const cell = `${w}x${heights[i]},${x},${y},${id(p)}`;
    y += heights[i] + 1;
    return cell;
  });
  const column = n === 1 ? cells[0] : `${w}x${rows},${x},0[${cells.join(',')}]`;
  return {size: cols + 'x' + rows, layout: `${cols}x${rows},0,0{${leadCols}x${rows},0,0,${id(leader)},${column}}`};
}

// tmux checks a layout against its checksum.
function checksum(layout) {
  let sum = 0;
  for (const c of layout) sum = ((sum >> 1) + ((sum & 1) << 15) + c.charCodeAt(0)) & 0xffff;
  return sum.toString(16).padStart(4, '0');
}

// apply sends the desired window size and layout when they change, one at a
// time. Every view of a session shares its window, so a view sends only its
// own changes and leaves another view's layout in place; otherwise two views
// of different sizes would replace each other's layouts without end. The view
// the user focuses sends its layout again.
let applying = false, reapply = false, size = '', sent = '';
function apply() {
  if (!client || !shown?.window || !shown.leader) return;
  if (applying) { reapply = true; return; }
  const want = desired();
  const key = shown.window + ' ' + want.layout;
  if (key === sent) return;
  applying = true;
  sent = key;
  size = want.size;
  const [cols, rows] = size.split('x');
  send(`resize-window -t '${shown.window}' -x ${cols} -y ${rows}`);
  send(`select-layout -t '${shown.window}' '${checksum(want.layout)},${want.layout}'`, () => {
    applying = false;
    if (reapply) { reapply = false; apply(); }
  });
}
window.addEventListener('focus', () => { sent = ''; apply(); });
// The workers panel narrows when its scrollbar appears.
const resized = new ResizeObserver(() => apply());
resized.observe(center);
resized.observe(workers);

// A new terminal shows the pane's history and screen, then its live output.
// Output that arrives before the capture is already part of it.
function open(id, cols, rows) {
  const box = document.createElement('div');
  const term = new Terminal({fontFamily, fontSize, cols, rows, theme, cursorInactiveStyle: 'none'});
  // The terminal renders its first frame once its box is in the page.
  lead.append(box);
  term.open(box);
  webgl(term);
  term.box = box;
  term.loading = true;
  terms.set(id, term);
  term.attachCustomKeyEventHandler(e => {
    const text = e.type === 'keydown' && editing(e);
    if (!text) return true;
    e.preventDefault();
    keys(id, new TextEncoder().encode(text));
    return false;
  });
  term.onData(data => keys(id, new TextEncoder().encode(data)));
  term.onBinary(data => keys(id, Uint8Array.from(data, c => c.charCodeAt(0))));
  term.textarea.addEventListener('focus', () => send(`select-pane -t '${id}'`));
  let cursor;
  send(`display-message -p -t '${id}' '#{cursor_x} #{cursor_y} #{alternate_on}'`, lines => cursor = (lines[0] || '0 0 0').split(' '));
  send(`capture-pane -p -e -S - -t '${id}'`, lines => {
    const [cx, cy, alternate] = cursor;
    term.write((alternate === '1' ? '\x1b[?1049h\x1b[H' : '') + lines.join('\r\n') + `\x1b[${+cy + 1};${+cx + 1}H`);
    term.loading = false;
  });
  return term;
}

// editing gives the bytes Ghostty sends for the macOS text editing shortcuts,
// which xterm.js leaves to the browser, and for Shift+Enter, which xterm.js
// sends as Enter. Every harness reads that CSI u sequence as a new line.
function editing(e) {
  const mods = (e.metaKey ? 'cmd+' : '') + (e.altKey ? 'alt+' : '') + (e.ctrlKey ? 'ctrl+' : '') + (e.shiftKey ? 'shift+' : '');
  return {
    'shift+Enter': '\x1b[13;2u',
    'cmd+Backspace': '\x15',
    'cmd+ArrowLeft': '\x01',
    'cmd+ArrowRight': '\x05',
    'alt+ArrowLeft': '\x1bb',
    'alt+ArrowRight': '\x1bf',
  }[mods + e.key];
}

function keys(id, bytes) {
  for (let i = 0; i < bytes.length; i += 256) {
    const hex = Array.from(bytes.subarray(i, i + 256), b => b.toString(16).padStart(2, '0')).join(' ');
    send(`send-keys -t '${id}' -H ${hex}`);
  }
}

// post sends an action to the server and returns its response text, or null
// if the server refused, after showing why.
async function post(action) {
  const res = await fetch(action, {method: 'POST'});
  const text = await res.text();
  if (!res.ok) alert(text);
  return res.ok ? text : null;
}

// Clicking a session selects it. Clicking an action asks its question, if
// any, then posts it to the server and shows why it refused.
document.body.addEventListener('click', async e => {
  closeMenu();
  const leadButton = e.target.closest('[data-leads]');
  const action = e.target.closest('[data-action]');
  const row = e.target.closest('[data-select]');
  if (leadButton) {
    await pickLead(leadButton);
  } else if (action) {
    if (action.dataset.question && !confirm(action.dataset.question)) return;
    post(action.dataset.action);
  } else if (row) {
    select(row.dataset.select);
  }
});

// Right-clicking a workspace or session opens its context menu at the pointer.
// A click, Escape, or leaving the page closes it.
const menu = $('menu');
const menuItemClass = 'mx-1 block w-[calc(100%-8px)] rounded-[3px] px-6 py-1 text-left text-neutral-300 outline-none hover:bg-[#04395e] hover:text-white focus-visible:bg-[#04395e] focus-visible:text-white';

let menuRequest = 0;

function closeMenu() {
  menu.hidden = true;
  menu.onclick = null;
  menuRequest++;
}

function placeMenu(x, y) {
  menu.hidden = false;
  menu.style.left = Math.max(0, Math.min(x, innerWidth - menu.offsetWidth)) + 'px';
  menu.style.top = Math.max(0, Math.min(y, innerHeight - menu.offsetHeight)) + 'px';
}

// The lead picker is a menu under the workspace's + button, listing each lead
// by its description. Picking one creates a
// session with it and selects the session.
async function pickLead(button) {
  const request = ++menuRequest, workspace = button.dataset.leads;
  const rect = button.getBoundingClientRect();
  const res = await fetch('leads');
  if (!res.ok) { alert(await res.text()); return; }
  const leads = await res.json();
  if (request !== menuRequest) return;
  menu.innerHTML = leads.map(p => `<button type="button" role="menuitem" data-lead="${escape(p.name)}" class="${menuItemClass} whitespace-nowrap">${escape(p.description)}</button>`).join('');
  menu.onclick = async e => {
    const item = e.target.closest('[data-lead]');
    if (!item) return;
    closeMenu();
    const id = await post('session?' + new URLSearchParams({action: 'new', workspace, lead: item.dataset.lead}));
    if (id) select(id);
  };
  placeMenu(rect.left, rect.bottom);
  menu.querySelector('[role="menuitem"]')?.focus();
}

// Arrow keys move between a menu's items.
menu.addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const items = [...menu.querySelectorAll('[role="menuitem"]')];
  const i = items.indexOf(document.activeElement);
  items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length]?.focus();
});

// A session's menu starts or stops it and deletes it; a workspace's deletes it.
document.addEventListener('contextmenu', e => {
  closeMenu();
  const row = e.target.closest('[data-session]'), header = e.target.closest('[data-workspace]');
  const s = sessions().find(s => s.id === row?.dataset.session);
  const w = data.find(w => w.id === header?.dataset.workspace);
  let items;
  if (s) {
    const action = name => 'session?' + new URLSearchParams({action: name, id: s.id});
    const live = s.running && dead !== s.id;
    items = [live ? {label: 'Stop Session', action: action('stop')} : {label: 'Start Session', action: action('start')},
      {label: 'Delete Session', action: action('delete'), question: `Delete session ${s.title}?`}];
  } else if (w) {
    items = [{label: 'Delete Workspace', action: 'workspace?' + new URLSearchParams({action: 'delete', id: w.id}), question: `Delete workspace ${w.name}?`}];
  } else {
    return;
  }
  e.preventDefault();
  menu.innerHTML = items.map(i => `<button type="button" role="menuitem" data-action="${escape(i.action)}" ${i.question ? `data-question="${escape(i.question)}"` : ''}
    class="${menuItemClass}">${escape(i.label)}</button>`).join('');
  placeMenu(e.clientX, e.clientY);
});
addEventListener('pointerdown', e => {
  if (!menu.contains(e.target)) closeMenu();
}, true);
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
});
addEventListener('blur', closeMenu);

$('add-workspace').onclick = () => post('workspace?action=new');

// The panel shows a shell in the session's terminal window, a second tmux
// window beside its agents'. The window opens when the panel first shows and
// lasts until its shell exits or the session stops.
let panelOpen = false, shell = null, creating = false;

function renderPanel(terminal) {
  // The window exists before it is marked, so creating lasts until a refresh
  // lists the marked terminal.
  if (terminal) creating = false;
  if (shell && shell.window !== terminal?.id) {
    const term = terms.get(shell.pane);
    term.box.remove(); term.dispose(); terms.delete(shell.pane);
    // As in VS Code, the panel closes when its terminal exits.
    const exited = !terminal;
    shell = null;
    if (exited) setPanel(false);
  }
  if (!panelOpen || !client) return;
  if (!terminal) {
    if (!creating) createTerminal();
    return;
  }
  if (!shell) {
    const [, cols, rows] = terminal.layout.match(/,(\d+)x(\d+),/);
    shell = {window: terminal.id, pane: terminal.pane, size: cols + 'x' + rows};
    const term = open(terminal.pane, +cols, +rows);
    panel.append(term.box);
    term.focus();
  }
  fitPanel();
}

function createTerminal() {
  creating = true;
  send(`new-window -d -t '${session}:' -c '#{session_path}' -P -F '#{window_id}'`, ([id], error) => {
    if (error) { creating = false; return; }
    send(`set-option -w -t '${id}' remain-on-exit off`);
    send(`set-option -w -t '${id}' window-style '${terminalStyle}'`);
    send(`set-option -w -t '${id}' @hypercube_terminal 1`);
    refresh();
  });
}

// The terminal's window fills the panel.
function fitPanel() {
  if (!shell || panel.hidden) return;
  const cols = Math.max(2, Math.floor((panel.clientWidth - 8) / cell.width));
  const rows = Math.max(1, Math.floor((panel.clientHeight - 4) / cell.height));
  if (shell.size === cols + 'x' + rows) return;
  shell.size = cols + 'x' + rows;
  send(`resize-window -t '${shell.window}' -x ${cols} -y ${rows}`);
}
new ResizeObserver(fitPanel).observe(panel);

function setPanel(open) {
  panelOpen = open;
  panel.hidden = $('panel-sash').hidden = !open;
  const button = $('toggle-panel');
  button.setAttribute('aria-pressed', open);
  button.title = open ? 'Hide Panel' : 'Show Panel';
  button.firstElementChild.className = `icon ${open ? 'icon-layout-panel' : 'icon-layout-panel-off'} size-4`;
  terms.get(open ? shell?.pane : activePane)?.focus();
  if (open) refresh();
}
$('toggle-panel').onclick = () => setPanel(!panelOpen);

$('toggle-sidebar').onclick = () => {
  const open = sidebar.hidden;
  sidebar.hidden = $('sidebar-sash').hidden = !open;
  $('toggle-sidebar').setAttribute('aria-pressed', open);
  $('toggle-sidebar').title = open ? 'Hide Left Panel' : 'Show Left Panel';
  $('toggle-sidebar').firstElementChild.className = `icon ${open ? 'icon-layout-sidebar-left' : 'icon-layout-sidebar-left-off'} size-4`;
};

// drag follows the pointer from a sash until release.
let dragging = false;
function drag(sash, move, release) {
  sash.onpointerdown = e => {
    e.preventDefault();
    dragging = true;
    sash.classList.add('dragging');
    const up = () => {
      dragging = false;
      sash.classList.remove('dragging');
      removeEventListener('pointermove', move, true);
      removeEventListener('pointerup', up, true);
      release?.();
    };
    addEventListener('pointermove', move, true);
    addEventListener('pointerup', up, true);
  };
}
drag($('sidebar-sash'), e => sidebar.style.width = Math.max(160, Math.min(e.clientX, innerWidth / 2)) + 'px');
drag($('panel-sash'), e => panel.style.height = Math.max(2 * cell.height + 4, Math.min(panel.getBoundingClientRect().bottom - e.clientY, innerHeight * 0.8)) + 'px');
// Dragging the divider sets the lead's columns. tmux's main-pane-width keeps
// them when Hypercube lays the window out again for a new worker.
let leadWidth = null;
drag(split, e => {
  if (!size) return;
  const column = Math.round((e.clientX - center.getBoundingClientRect().left - cardX) / cell.width);
  leadWidth = Math.max(20, Math.min(+size.split('x')[0] - 21, column));
  lead.style.width = leadWidth * cell.width + cardX + 'px';
  apply();
}, () => {
  if (leadWidth !== null && shown?.window) send(`set-option -w -t '${shown.window}' main-pane-width ${leadWidth}`);
});

watch();
</script>
</body>
</html>
