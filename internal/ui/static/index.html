<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<title>Hypercube</title>
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="ui.css">
</head>
<body class="h-full overflow-hidden bg-[#1e1e1e] text-sm text-neutral-300">
<div class="flex h-full flex-col">
<header class="flex h-9 shrink-0 items-center gap-1 border-b border-neutral-700 bg-[#323233] px-2">
  <button type="button" id="toggle-sidebar" title="Hide Left Panel" aria-pressed="true" class="ml-auto flex rounded p-1 text-neutral-400 hover:bg-neutral-700 hover:text-neutral-100">
    <span class="icon icon-layout-sidebar-left size-4"></span>
  </button>
  <button type="button" id="toggle-panel" title="Show Panel" aria-pressed="false" class="flex rounded p-1 text-neutral-400 hover:bg-neutral-700 hover:text-neutral-100">
    <span class="icon icon-layout-panel-off size-4"></span>
  </button>
</header>

<div class="flex min-h-0 flex-1">
  <aside id="sidebar" class="flex w-[260px] shrink-0 flex-col bg-[#252526]">
    <div class="flex h-[35px] shrink-0 items-center justify-between pr-2 pl-4 text-[11px] font-semibold tracking-wide text-neutral-400 uppercase">
      Workspaces
      <button type="button" id="add-workspace" title="New Workspace" class="flex size-[22px] items-center justify-center rounded text-neutral-300 hover:bg-[#5a5d5e50]"><span class="icon icon-add size-4"></span></button>
    </div>
    <ul id="sessions" class="min-h-0 flex-1 overflow-auto"></ul>
  </aside>
  <div id="sidebar-sash" class="sash"></div>
  <div class="flex min-w-0 flex-1 flex-col">
    <div id="center" class="flex min-h-0 flex-1">
      <div id="lead" class="min-w-0 flex-1 overflow-hidden pt-1 pl-2"></div>
      <div id="split" class="sash" hidden></div>
      <div id="workers" class="flex min-w-0 flex-1 flex-col gap-3 overflow-y-auto p-3 [scrollbar-gutter:stable]" hidden></div>
    </div>
    <div id="panel-sash" class="sash" aria-orientation="horizontal" hidden></div>
    <div id="panel" class="h-[240px] max-h-[80vh] shrink-0 overflow-hidden pt-1 pl-2" hidden></div>
  </div>
</div>
</div>

<div id="menu" role="menu" hidden class="fixed z-50 min-w-[160px] rounded-[5px] border border-[#454545] bg-[#252526] py-1 text-[13px] shadow-lg shadow-black/50"></div>
<div id="probe" class="invisible absolute"></div>
<script src="xterm.js"></script>
<script src="addon-webgl.js"></script>
<script>
// The page is a tmux control-mode client for one workspace at a time. The
// sidebar lists every workspace's sessions, which are tmux windows, under a
// row naming the workspace. The current window's lead fills the left, and its
// workers are cards on the right, each showing either a summary or its
// terminal. tmux sizes the panes; the page asks for the sizes its layout has
// room for.

const fontFamily = 'Menlo, Monaco, "Courier New", monospace', fontSize = 13;
const theme = {background: '#1e1e1e'};
// The WebGL renderer draws box and block characters to fill their cells
// exactly, as terminals do. The probe uses it too, since it sizes cells to
// whole device pixels.
function webgl(term) {
  const addon = new WebglAddon.WebglAddon();
  addon.onContextLoss(() => addon.dispose());
  term.loadAddon(addon);
}

const probe = new Terminal({fontFamily, fontSize});
probe.open(document.getElementById('probe'));
webgl(probe);
const cell = probe._core._renderService.dimensions.css.cell;

const $ = id => document.getElementById(id);
const center = $('center'), lead = $('lead'), split = $('split'), workers = $('workers');
const sessionList = $('sessions'), sidebar = $('sidebar'), panel = $('panel');

// Pixels around the terminals: the lead's left and top padding, and the
// workers panel's padding, a card's border, and its terminal's padding.
const leadX = 8, leadY = 4, workerX = 24 + 2 + 16;

let source, client, session, outbox, sending, callbacks, block, terms, shown, activePane;
let workspaces = [];

function connect() {
  outbox = []; sending = false; callbacks = []; block = null; size = ''; refreshing = again = false; activePane = null;
  applying = reapply = false; pendingLayouts.clear(); shell = null; creating = false;
  terms = new Map();
  lead.replaceChildren();
  workers.replaceChildren();
  panel.replaceChildren();
  workerCards.clear();
  source = new EventSource('events?session=' + encodeURIComponent(location.hash.slice(1)));
  source.addEventListener('id', e => { client = e.data; refresh(); });
  source.onmessage = e => received(Uint8Array.from(atob(e.data), c => c.charCodeAt(0)));
  source.onerror = () => {
    source.close(); client = null;
    // The sidebar empties when the last workspace stops.
    workspaces = [];
    renderSidebar();
    setTimeout(connect, 1000);
  };
}

// Commands go out in order, batched while a request is in flight. Commands
// sent together reach tmux together, so it resizes each pane once for all of
// them. Each command's reply block comes back in the same order.
function send(command, callback) {
  callbacks.push(callback);
  outbox.push(command);
  queueMicrotask(flush);
}

async function flush() {
  if (sending || !outbox.length || !client) return;
  sending = true;
  const body = outbox.join('\n');
  outbox = [];
  try { await fetch('send?id=' + client, {method: 'POST', body}); } catch {}
  sending = false;
  flush();
}

const decoder = new TextDecoder();
const structural = /^%(layout-change|window-add|window-close|window-renamed|unlinked-window-(add|close|renamed)|session-window-changed|sessions-changed|session-renamed|window-pane-changed)( |$)/;

function received(bytes) {
  if (block) {
    const text = decoder.decode(bytes);
    if (text === '%end ' + block.id || text === '%error ' + block.id) {
      const callback = block.own && callbacks.shift();
      if (callback) callback(block.lines, text.startsWith('%error'));
      block = null;
    } else {
      block.lines.push(text);
    }
    return;
  }
  if (bytes.length > 8 && decoder.decode(bytes.subarray(0, 8)) === '%output ') {
    const space = bytes.indexOf(32, 8);
    const term = terms.get(decoder.decode(bytes.subarray(8, space)));
    resizeTerminals();
    if (term && !term.loading) term.write(unescape(bytes.subarray(space + 1)));
    return;
  }
  const text = decoder.decode(bytes);
  if (text.startsWith('%begin ')) {
    const id = text.slice(7);
    block = {id, own: id.endsWith(' 1'), lines: []};
  } else if (text.startsWith('%session-changed ')) {
    const [, id, name] = text.match(/^%session-changed (\S+) (.*)$/);
    session = id;
    history.replaceState(null, '', '#' + encodeURIComponent(name));
    refresh();
  } else if (structural.test(text)) {
    const change = text.match(/^%layout-change (\S+) (\S+)/);
    if (change) {
      pendingLayouts.set(change[1], change[2]);
      requestAnimationFrame(resizeTerminals);
    }
    refresh();
  }
}

// A pane's program redraws for its new size as soon as tmux resizes it, so
// its terminal takes the size tmux announced before writing more output.
// Commands sent together can announce several layouts for a window; only the
// last counts.
const pendingLayouts = new Map();
function resizeTerminals() {
  for (const layout of pendingLayouts.values()) {
    for (const [, w, h, id] of layout.matchAll(/(\d+)x(\d+),\d+,\d+,(\d+)/g)) {
      const term = terms.get('%' + id);
      if (term && (term.cols !== +w || term.rows !== +h)) term.resize(+w, +h);
    }
  }
  pendingLayouts.clear();
}

// tmux escapes control characters and backslashes in pane output as \ooo.
function unescape(bytes) {
  const out = new Uint8Array(bytes.length);
  let n = 0;
  for (let i = 0; i < bytes.length; i++) {
    if (bytes[i] === 92 && i + 3 < bytes.length) {
      out[n++] = (bytes[i + 1] - 48) * 64 + (bytes[i + 2] - 48) * 8 + (bytes[i + 3] - 48);
      i += 3;
    } else {
      out[n++] = bytes[i];
    }
  }
  return out.subarray(0, n);
}

// One refresh at a time; notifications during one schedule another. Option
// changes send no notification, so a timer catches them.
let refreshing = false, again = false;
setInterval(refresh, 1000);

function refresh() {
  if (!client) return;
  if (refreshing) { again = true; return; }
  refreshing = true;
  const rows = (lines, keys) => lines.map(line => {
    const values = line.split('\t'), row = {};
    keys.forEach((key, i) => row[key] = i === keys.length - 1 ? values.slice(i).join('\t') : values[i]);
    return row;
  });
  // Labels of the window's panes with an option set, each followed by |.
  const labels = option => `#{P:#{?${option},#{@hypercube_label}|,}}`;
  let sessions, wins;
  send(`list-sessions -F '#{session_id}\t#{@hypercube_state}\t#{W:#{P:#{?@hypercube_attention,1,}}}\t#{W:#{P:#{?@hypercube_busy,1,}}}\t#{@hypercube_workspace}'`,
    lines => sessions = rows(lines, ['id', 'state', 'attention', 'busy', 'name']).filter(s => s.state));
  send(`list-windows -a -F '#{session_id}\t#{window_id}\t#{window_active}\t#{@hypercube_replied}\t#{@hypercube_team}\t${labels('@hypercube_attention')}\t${labels('@hypercube_busy')}\t#{window_layout}\t#{@hypercube_terminal}\t#{pane_id}\t#{window_name}'`,
    lines => wins = rows(lines, ['session', 'id', 'active', 'replied', 'team', 'attention', 'busy', 'layout', 'terminal', 'pane', 'name']));
  send(`list-panes -F '#{pane_id}\t#{pane_left}\t#{pane_top}\t#{pane_width}\t#{pane_height}\t#{pane_active}\t#{pane_dead}\t#{pane_dead_status}\t#{@hypercube_busy}\t#{@hypercube_attention}\t#{@hypercube_open}\t#{@hypercube_status_at}\t#{@hypercube_usage}\t#{@hypercube_status}\t#{@hypercube_label}'`,
    (lines, error) => {
      refreshing = false;
      if (!error && sessions && wins) render(sessions, wins, rows(lines, ['id', 'left', 'top', 'width', 'height', 'active', 'dead', 'status', 'busy', 'attention', 'open', 'reportedAt', 'usage', 'report', 'label']));
      if (again) { again = false; refresh(); }
    });
}

// An agent's label is "name · harness model effort · directory".
const agentName = label => label.replaceAll('##', '#').split(' · ')[0];
const names = list => list.split('|').filter(Boolean).map(agentName).join(', ');

const escape = text => text.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

// update replaces an element's children only when they change. A click is lost
// when the element under the pointer is replaced between press and release.
// Parsing the new HTML first compares it as the page would serialize it.
function update(parent, html) {
  const next = document.createElement('template');
  next.innerHTML = html;
  if (parent.innerHTML !== next.innerHTML) parent.replaceChildren(next.content);
}

function render(sessions, wins, list) {
  const current = sessions.find(s => s.id === session);
  const win = wins.find(w => w.session === session && w.active === '1');
  const waiting = sessions.reduce((n, s) => n + s.attention.length, 0);
  document.title = (waiting ? `(${waiting}) ` : '') +
    [win?.name, current?.name, 'Hypercube'].filter(Boolean).join(' — ');

  workspaces = sessions;
  windows = wins.filter(w => !w.terminal);
  renderSidebar();
  renderPanel(wins.find(w => w.session === session && w.terminal));
  // tmux can select the terminal's window when it closes the current one.
  if (win?.terminal) {
    const other = windows.find(w => w.session === session);
    if (other) send(`select-window -t '${other.id}'`);
    return;
  }

  for (const p of list) for (const key of ['left', 'top', 'width', 'height']) p[key] = +p[key];
  const [leader] = list.filter(p => p.left === 0);
  const stacked = list.filter(p => p.left > 0).sort((a, b) => a.top - b.top);
  // A refresh sent before a card was switched still reports its old state.
  for (const p of stacked) {
    if (!toggled.has(p.id)) continue;
    if (toggled.get(p.id) === p.open) toggled.delete(p.id);
    else p.open = toggled.get(p.id);
  }
  if (win?.id !== shown?.window) leadWidth = null;
  shown = {window: win?.id, leader, stacked, layout: win?.layout.slice(5)};

  // Each pane's terminal matches the pane's size and sits in the lead's panel
  // or its worker's card.
  for (const p of list) {
    let term = terms.get(p.id);
    if (!term) term = open(p.id, p.width, p.height);
    else if (term.cols !== p.width || term.rows !== p.height) term.resize(p.width, p.height);
    const parent = p === leader ? lead : card(p).slot;
    if (term.box.parentElement !== parent) parent.append(term.box);
    // The terminal takes the focus when tmux selects another pane.
    if (p.active === '1' && p.id !== activePane && (p === leader || p.open)) { activePane = p.id; term.focus(); }
  }
  for (const [id, term] of terms) {
    if (id !== shell?.pane && !list.some(p => p.id === id)) { term.box.remove(); term.dispose(); terms.delete(id); }
  }
  for (const [id, c] of workerCards) {
    if (!stacked.some(p => p.id === id)) { c.element.remove(); workerCards.delete(id); }
  }
  // Moving a card that is already in place would blur its terminal.
  stacked.forEach((p, i) => {
    const element = card(p).element;
    if (workers.children[i] !== element) workers.insertBefore(element, workers.children[i] ?? null);
  });

  const any = stacked.length > 0;
  split.hidden = workers.hidden = !any;
  lead.classList.toggle('flex-1', !any);
  lead.classList.toggle('shrink-0', any);
  // The lead keeps a width being dragged until tmux has applied it.
  if (leadWidth === leader?.width && !dragging) leadWidth = null;
  lead.style.width = any && leader ? (leadWidth ?? leader.width) * cell.width + leadX + 'px' : '';

  // A layout tmux reapplied, such as for a new worker, is replaced.
  apply();
}

// The sidebar lists each workspace's sessions below a row that collapses
// them. It stays as it is while a session is being renamed.
let windows = [], renaming = false;
const collapsed = new Set();

// A busy session shows a spinner in the column of the workspace's folder icon.
const spinner = title => `<span role="img" title="${escape(title)}" class="icon icon-loading size-4 text-neutral-400"></span>`;

function renderSidebar() {
  if (renaming) return;
  update(sessionList, workspaces.map(s => {
    const open = !collapsed.has(s.id);
    const action = name => escape(new URLSearchParams({action: name, state: s.state}).toString());
    return `<li class="group flex items-center gap-1 pr-2 hover:bg-[#2a2d2e]"
        data-delete="workspace?${action('delete')}" data-label="Delete Workspace" data-question="Delete workspace ${escape(s.name)}?">
        <button type="button" data-collapse="${s.id}" aria-expanded="${open}" class="flex min-w-0 flex-1 items-center gap-2 py-1.5 pl-4 text-left text-neutral-400">
          ${s.busy ? spinner('Busy') : `<span class="icon ${open ? 'icon-folder-opened' : 'icon-folder'} size-4"></span>`}<span class="truncate">${escape(s.name)}</span>
        </button>
        <button type="button" title="New Session" class="invisible flex size-[22px] group-hover:visible group-focus-within:visible items-center justify-center rounded text-neutral-300 hover:bg-[#5a5d5e50]"
          data-action="window?${action('new')}"><span class="icon icon-add size-4"></span></button>
      </li>` +
      (open ? windows.filter(w => w.session === s.id).map(w => sessionRow(w, s)).join('') : '');
  }).join(''));
}

sessionList.addEventListener('click', e => {
  const header = e.target.closest('[data-collapse]');
  if (!header) return;
  const id = header.dataset.collapse;
  if (!collapsed.delete(id)) collapsed.add(id);
  renderSidebar();
});

// Double-clicking a session replaces it with a field for its new title. Enter
// or leaving the field saves the title, and Escape cancels.
sessionList.addEventListener('dblclick', e => {
  const row = e.target.closest('[data-rename]');
  const w = windows.find(w => w.id === row?.dataset.rename);
  const workspace = workspaces.find(s => s.id === w?.session);
  if (!w?.team || !workspace) return;
  renaming = true;
  const input = document.createElement('input');
  input.value = w.name;
  input.className = 'my-1 mr-1 ml-9 min-w-0 flex-1 border border-sky-500 bg-[#3c3c3c] px-1 py-0.5 text-neutral-100 outline-none';
  row.replaceWith(input);
  input.focus();
  input.select();
  const finish = save => {
    if (!renaming) return;
    renaming = false;
    const title = input.value.trim();
    if (save && title && title !== w.name) {
      post('window?' + new URLSearchParams({action: 'rename', state: workspace.state, team: w.team, window: w.id, title}));
      w.name = title;
    }
    sessionList.replaceChildren();
    renderSidebar();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') finish(true);
    else if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
});

function sessionRow(w, workspace) {
  const active = w.session === session && w.active === '1';
  const busy = names(w.busy), waiting = names(w.attention);
  const remove = w.team ? `data-delete="window?${escape(new URLSearchParams({action: 'delete', state: workspace.state, team: w.team, window: w.id}).toString())}"
    data-label="Delete Session" data-question="Delete session ${escape(w.name)}?"` : '';
  return `<li class="${active ? 'bg-[#37373d] text-neutral-100' : 'hover:bg-[#2a2d2e]'}" ${remove}>
    <div class="flex items-center gap-1 pr-2">
      <button type="button" data-command="switch-client -t '${w.id}'" data-rename="${w.id}" class="flex min-w-0 flex-1 items-center gap-2 py-1.5 pl-4 text-left">
        ${busy ? spinner('Busy: ' + busy) : '<span class="size-4 shrink-0"></span>'}
        <span class="flex min-w-0 items-center gap-1.5">
          <span class="truncate">${escape(w.name)}</span>
          ${waiting ? `<span title="Waiting on you: ${escape(waiting)}" class="size-2 shrink-0 rounded-full bg-amber-400"></span>` : ''}
          ${w.replied && !active ? '<span title="New reply" class="size-2 shrink-0 rounded-full bg-sky-400"></span>' : ''}
        </span>
      </button>
    </div>
  </li>`;
}

// Token counts read as 845, 84k, 1.2M.
function tokens(n) {
  if (n < 1000) return String(n);
  const [scale, unit] = n < 1e6 ? [1e3, 'k'] : [1e6, 'M'];
  return (n < 10 * scale ? Math.floor(n / scale * 10) / 10 : Math.floor(n / scale)) + unit;
}

// A report's age reads as now, 3m, 2h, 1d.
function age(ms) {
  const minutes = Math.floor((Date.now() - ms) / 60000);
  if (minutes < 1) return 'now';
  if (minutes < 60) return minutes + 'm';
  return minutes < 1440 ? Math.floor(minutes / 60) + 'h' : Math.floor(minutes / 1440) + 'd';
}

// The summary is the worker's report of what it is doing and a footer with its
// context use, cost, and the report's age. Each part shows once it is known.
function summary(p) {
  const [context, window, cost] = p.usage.split(' ').map(Number);
  const radius = 6, circumference = 2 * Math.PI * radius;
  const ring = window ? `<svg viewBox="0 0 16 16" class="size-3.5 shrink-0 -rotate-90">
        <circle cx="8" cy="8" r="${radius}" fill="none" stroke="currentColor" stroke-width="2" class="text-neutral-700"/>
        <circle cx="8" cy="8" r="${radius}" fill="none" stroke="currentColor" stroke-width="2" class="text-sky-400"
          stroke-dasharray="${circumference}" stroke-dashoffset="${(circumference * (1 - Math.min(1, context / window))).toFixed(2)}"/>
      </svg>` : '';
  const usage = [window ? `${tokens(context)} / ${tokens(window)}` : '', cost ? (cost < 0.01 ? '<$0.01' : `$${cost.toFixed(2)}`) : ''].filter(Boolean).join(' · ');
  const footer = usage || p.report ? `<footer class="flex items-center gap-2 text-neutral-500">
      <span class="flex items-center gap-1.5 whitespace-nowrap">${ring}${usage}</span>
      ${p.report ? `<span class="ml-auto shrink-0">${age(+p.reportedAt)}</span>` : ''}
    </footer>` : '';
  return (p.report ? `<p class="line-clamp-4 break-words text-neutral-300">${escape(p.report)}</p>` : '') + footer;
}

// A worker's card shows its name, status, and summary, or its name, status,
// and terminal. Cards persist so their terminals stay attached.
const workerCards = new Map();

function card(p) {
  let c = workerCards.get(p.id);
  if (!c) {
    const element = document.createElement('article');
    element.dataset.pane = p.id;
    element.innerHTML = `<header class="flex items-center gap-2">
        <span class="name min-w-0 truncate text-left text-sm text-neutral-100"></span>
        <span class="status ml-auto shrink-0"></span>
        <button type="button" class="toggle flex rounded p-0.5 text-neutral-400 hover:bg-neutral-700 hover:text-neutral-100 aria-pressed:bg-neutral-700 aria-pressed:text-neutral-100">
          <span class="icon icon-terminal size-3.5"></span>
        </button>
      </header>
      <div class="summary flex flex-col gap-2"></div>
      <div class="slot -mx-3 -mb-3 flex min-h-0 flex-1 flex-col justify-end overflow-hidden rounded-b-md border-t border-neutral-700 bg-[#1e1e1e] px-2 py-1"></div>`;
    const q = name => element.querySelector('.' + name);
    c = {element, name: q('name'), status: q('status'), toggle: q('toggle'), summary: q('summary'), slot: q('slot')};
    workerCards.set(p.id, c);
  }
  const status = p.dead === '1' ? `<span title="Exited with status ${escape(p.status)}" class="block size-2 rounded-full bg-red-400"></span>`
    : p.attention ? '<span title="Waiting on you" class="block size-2 rounded-full bg-amber-400"></span>'
    : p.busy ? '<span role="img" title="Busy" class="icon icon-loading block size-3.5 text-neutral-400"></span>'
    : '';
  const open = !!p.open;
  const className = `relative flex flex-col gap-2 rounded-md border bg-[#252526] p-3 text-xs ${open ? 'min-h-0 flex-1 basis-0' : 'shrink-0 cursor-pointer'} ${
    p.attention ? 'border-amber-400' : 'border-neutral-700 hover:border-neutral-500'}`;
  if (c.element.className !== className) c.element.className = className;
  if (c.name.textContent !== agentName(p.label)) c.name.textContent = agentName(p.label);
  update(c.status, status);
  c.toggle.setAttribute('aria-pressed', open);
  c.toggle.title = open ? 'Show Summary' : 'Show Terminal';
  const html = summary(p);
  update(c.summary, html);
  c.summary.hidden = open || !html;
  c.slot.hidden = !open;
  return c;
}

// Cards switched here that tmux has not reported yet.
const toggled = new Map();

// Clicking a card in summary shows its terminal; its terminal button switches
// back and forth.
workers.onclick = e => {
  const element = e.target.closest('[data-pane]');
  const p = shown?.stacked.find(p => p.id === element?.dataset.pane);
  if (!p || p.open && !e.target.closest('.toggle')) return;
  p.open = p.open ? '' : '1';
  toggled.set(p.id, p.open);
  send(p.open ? `set-option -p -t '${p.id}' @hypercube_open 1` : `set-option -p -u -t '${p.id}' @hypercube_open`);
  card(p);
  apply();
  if (p.open) terms.get(p.id).focus();
};

// The page lays out its panels, then gives tmux the window and pane sizes
// whose terminals fit them, in one layout. The lead fills the window's
// height. Its width is the lead's columns, tmux's one-column divider, and the
// workers' columns, which fit the workers panel less its gutter, padding, and
// card borders. A worker in summary gets one row, and the last in summary
// takes the rest. Open terminals get the rows their cards have room for; with
// every card open, they share all the rows, and each card shows the bottom of
// its terminal.
function desired() {
  const {leader, stacked} = shown, n = stacked.length;
  const gutter = n ? workers.offsetWidth - workers.clientWidth : 0;
  const cols = Math.max(n ? 42 : 1, Math.floor((center.clientWidth - leadX - (n ? 1 + workerX + gutter : 0)) / cell.width) + (n ? 1 : 0));
  const rows = Math.max(2 * n, 2, Math.floor((center.clientHeight - leadY) / cell.height));
  const id = p => p.id.slice(1);
  if (!n) return {size: cols + 'x' + rows, layout: `${cols}x${rows},0,0,${id(leader)}`};

  const leadCols = Math.max(20, Math.min(cols - 21, leadWidth ?? leader.width));
  const x = leadCols + 1, w = cols - x, free = rows - (n - 1);
  const open = stacked.filter(p => p.open);
  let heights;
  if (open.length === n) {
    const share = Math.floor(free / n);
    heights = stacked.map((p, i) => i === n - 1 ? free - share * (n - 1) : share);
  } else {
    const fit = p => Math.max(1, Math.floor((workerCards.get(p.id).slot.clientHeight - 8) / cell.height));
    heights = stacked.map(p => p.open ? fit(p) : 1);
    // Open terminals give up rows when the summaries have none left.
    const shrinkable = () => heights.some((h, i) => stacked[i].open && h > 1);
    for (let over = heights.reduce((a, b) => a + b, 0) - free, i = 0; over > 0 && shrinkable(); i = (i + 1) % n) {
      if (stacked[i].open && heights[i] > 1) { heights[i]--; over--; }
    }
    heights[stacked.findLastIndex(p => !p.open)] += free - heights.reduce((a, b) => a + b, 0);
  }
  let y = 0;
  const cells = stacked.map((p, i) => {
    const cell = `${w}x${heights[i]},${x},${y},${id(p)}`;
    y += heights[i] + 1;
    return cell;
  });
  const column = n === 1 ? cells[0] : `${w}x${rows},${x},0[${cells.join(',')}]`;
  return {size: cols + 'x' + rows, layout: `${cols}x${rows},0,0{${leadCols}x${rows},0,0,${id(leader)},${column}}`};
}

// tmux checks a layout against its checksum.
function checksum(layout) {
  let sum = 0;
  for (const c of layout) sum = ((sum >> 1) + ((sum & 1) << 15) + c.charCodeAt(0)) & 0xffff;
  return sum.toString(16).padStart(4, '0');
}

// apply sends the desired layout when it differs from tmux's, one at a time.
let applying = false, reapply = false, size = '';
function apply() {
  if (!client || !shown?.window || !shown.leader) return;
  if (applying) { reapply = true; return; }
  const want = desired();
  if (want.layout === shown.layout && want.size === size) return;
  applying = true;
  if (want.size !== size) { size = want.size; send(`refresh-client -C ${size}`); }
  send(`select-layout -t '${shown.window}' '${checksum(want.layout)},${want.layout}'`, (lines, error) => {
    if (!error) shown.layout = want.layout;
    applying = false;
    if (reapply) { reapply = false; apply(); }
  });
}
new ResizeObserver(() => apply()).observe(center);

// A new terminal shows the pane's history and screen, then its live output.
// Output that arrives before the capture is already part of it.
function open(id, cols, rows) {
  const box = document.createElement('div');
  const term = new Terminal({fontFamily, fontSize, cols, rows, theme, cursorInactiveStyle: 'none'});
  // The terminal renders its first frame once its box is in the page.
  lead.append(box);
  term.open(box);
  webgl(term);
  term.box = box;
  term.loading = true;
  terms.set(id, term);
  term.attachCustomKeyEventHandler(e => {
    const text = e.type === 'keydown' && editing(e);
    if (!text) return true;
    e.preventDefault();
    keys(id, new TextEncoder().encode(text));
    return false;
  });
  term.onData(data => keys(id, new TextEncoder().encode(data)));
  term.onBinary(data => keys(id, Uint8Array.from(data, c => c.charCodeAt(0))));
  term.textarea.addEventListener('focus', () => send(`select-pane -t '${id}'`));
  let cursor;
  send(`display-message -p -t '${id}' '#{cursor_x} #{cursor_y} #{alternate_on}'`, lines => cursor = (lines[0] || '0 0 0').split(' '));
  send(`capture-pane -p -e -S - -t '${id}'`, lines => {
    const [cx, cy, alternate] = cursor;
    term.write((alternate === '1' ? '\x1b[?1049h\x1b[H' : '') + lines.join('\r\n') + `\x1b[${+cy + 1};${+cx + 1}H`);
    term.loading = false;
  });
  return term;
}

// editing gives the bytes Ghostty sends for the macOS text editing shortcuts,
// which xterm.js leaves to the browser, and for Shift+Enter, which xterm.js
// sends as Enter. Every harness reads that CSI u sequence as a new line.
function editing(e) {
  const mods = (e.metaKey ? 'cmd+' : '') + (e.altKey ? 'alt+' : '') + (e.ctrlKey ? 'ctrl+' : '') + (e.shiftKey ? 'shift+' : '');
  return {
    'shift+Enter': '\x1b[13;2u',
    'cmd+Backspace': '\x15',
    'cmd+ArrowLeft': '\x01',
    'cmd+ArrowRight': '\x05',
    'alt+ArrowLeft': '\x1bb',
    'alt+ArrowRight': '\x1bf',
  }[mods + e.key];
}

function keys(id, bytes) {
  for (let i = 0; i < bytes.length; i += 256) {
    const hex = Array.from(bytes.subarray(i, i + 256), b => b.toString(16).padStart(2, '0')).join(' ');
    send(`send-keys -t '${id}' -H ${hex}`);
  }
}

// post sends an action to the server and returns its response text, or null
// if the server refused, after showing why.
async function post(action) {
  const res = await fetch(action, {method: 'POST'});
  const text = await res.text();
  if (!res.ok) alert(text);
  return res.ok ? text : null;
}

// Clicking a session sends its tmux command. Clicking an action asks its
// question, if any, then posts it to the server, which runs Hypercube's own
// command, and shows why it refused.
document.body.addEventListener('click', async e => {
  menu.hidden = true;
  const action = e.target.closest('[data-action]');
  const command = e.target.closest('[data-command]');
  if (action) {
    if (action.dataset.question && !confirm(action.dataset.question)) return;
    post(action.dataset.action);
  } else if (command) {
    send(command.dataset.command);
  }
});

// Right-clicking a workspace or session opens its context menu at the pointer.
// A click, Escape, or leaving the page closes it.
const menu = $('menu');
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('[data-delete]');
  menu.hidden = !row;
  if (!row) return;
  e.preventDefault();
  menu.innerHTML = `<button type="button" role="menuitem" data-action="${escape(row.dataset.delete)}" data-question="${escape(row.dataset.question)}"
    class="mx-1 block w-[calc(100%-8px)] rounded-[3px] px-6 py-1 text-left text-neutral-300 outline-none hover:bg-[#04395e] hover:text-white focus-visible:bg-[#04395e] focus-visible:text-white">${escape(row.dataset.label)}</button>`;
  menu.style.left = Math.min(e.clientX, innerWidth - menu.offsetWidth) + 'px';
  menu.style.top = Math.min(e.clientY, innerHeight - menu.offsetHeight) + 'px';
});
addEventListener('pointerdown', e => {
  if (!menu.contains(e.target)) menu.hidden = true;
}, true);
addEventListener('keydown', e => {
  if (e.key === 'Escape') menu.hidden = true;
});
addEventListener('blur', () => menu.hidden = true);

// A new workspace opens once it starts.
$('add-workspace').onclick = async () => {
  const text = await post('workspace?action=new');
  if (text) send(`switch-client -t '=${text}'`);
};

// The panel shows a shell in the workspace's terminal window, a tmux window
// outside every team that the sidebar leaves out. The window opens when the
// panel first shows and lasts until its shell exits or the workspace stops.
let panelOpen = false, shell = null, creating = false;

function renderPanel(terminal) {
  // The window exists before it is marked, so creating lasts until a refresh
  // lists the marked terminal.
  if (terminal) creating = false;
  if (shell && shell.window !== terminal?.id) {
    const term = terms.get(shell.pane);
    term.box.remove(); term.dispose(); terms.delete(shell.pane);
    // As in VS Code, the panel closes when its terminal exits.
    const exited = shell.session === session && !terminal;
    shell = null;
    if (exited) setPanel(false);
  }
  if (!panelOpen) return;
  if (!terminal) {
    if (!creating) createTerminal();
    return;
  }
  if (!shell) {
    const [, cols, rows] = terminal.layout.match(/,(\d+)x(\d+),/);
    shell = {session, window: terminal.id, pane: terminal.pane, size: cols + 'x' + rows};
    const term = open(terminal.pane, +cols, +rows);
    panel.append(term.box);
    term.focus();
  }
  fitPanel();
}

function createTerminal() {
  creating = true;
  send(`new-window -d -t '${session}:' -c '#{session_path}' -P -F '#{window_id}'`, ([id], error) => {
    if (error) { creating = false; return; }
    send(`set-option -w -t '${id}' remain-on-exit off`);
    send(`set-option -w -t '${id}' @hypercube_terminal 1`);
    refresh();
  });
}

// The terminal's window fills the panel.
function fitPanel() {
  if (!shell || panel.hidden) return;
  const cols = Math.max(2, Math.floor((panel.clientWidth - 8) / cell.width));
  const rows = Math.max(1, Math.floor((panel.clientHeight - 4) / cell.height));
  if (shell.size === cols + 'x' + rows) return;
  shell.size = cols + 'x' + rows;
  send(`resize-window -t '${shell.window}' -x ${cols} -y ${rows}`);
}
new ResizeObserver(fitPanel).observe(panel);

function setPanel(open) {
  panelOpen = open;
  panel.hidden = $('panel-sash').hidden = !open;
  const button = $('toggle-panel');
  button.setAttribute('aria-pressed', open);
  button.title = open ? 'Hide Panel' : 'Show Panel';
  button.firstElementChild.className = `icon ${open ? 'icon-layout-panel' : 'icon-layout-panel-off'} size-4`;
  terms.get(open ? shell?.pane : activePane)?.focus();
  if (open) refresh();
}
$('toggle-panel').onclick = () => setPanel(!panelOpen);

$('toggle-sidebar').onclick = () => {
  const open = sidebar.hidden;
  sidebar.hidden = $('sidebar-sash').hidden = !open;
  $('toggle-sidebar').setAttribute('aria-pressed', open);
  $('toggle-sidebar').title = open ? 'Hide Left Panel' : 'Show Left Panel';
  $('toggle-sidebar').firstElementChild.className = `icon ${open ? 'icon-layout-sidebar-left' : 'icon-layout-sidebar-left-off'} size-4`;
};

// drag follows the pointer from a sash until release.
let dragging = false;
function drag(sash, move, release) {
  sash.onpointerdown = e => {
    e.preventDefault();
    dragging = true;
    sash.classList.add('dragging');
    const up = () => {
      dragging = false;
      sash.classList.remove('dragging');
      removeEventListener('pointermove', move, true);
      removeEventListener('pointerup', up, true);
      release?.();
    };
    addEventListener('pointermove', move, true);
    addEventListener('pointerup', up, true);
  };
}
drag($('sidebar-sash'), e => sidebar.style.width = Math.max(160, Math.min(e.clientX, innerWidth / 2)) + 'px');
drag($('panel-sash'), e => panel.style.height = Math.max(2 * cell.height + 4, Math.min(panel.getBoundingClientRect().bottom - e.clientY, innerHeight * 0.8)) + 'px');
// Dragging the divider sets the lead's columns. tmux's main-pane-width keeps
// them when Hypercube lays the window out again for a new worker.
let leadWidth = null;
drag(split, e => {
  if (!size) return;
  const column = Math.round((e.clientX - center.getBoundingClientRect().left - leadX) / cell.width);
  leadWidth = Math.max(20, Math.min(+size.split('x')[0] - 21, column));
  lead.style.width = leadWidth * cell.width + leadX + 'px';
  apply();
}, () => {
  if (leadWidth !== null && shown?.window) send(`set-option -w -t '${shown.window}' main-pane-width ${leadWidth}`);
});

connect();
</script>
</body>
</html>
