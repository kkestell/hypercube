{{- $src := .Destination -}}
{{- $url := urls.Parse $src -}}
{{- if and (not $url.IsAbs) (not (strings.HasPrefix $src "/")) -}}
  {{- $src = path.Join "/" .Page.File.Dir $src | relURL -}}
{{- end -}}
{{- if strings.HasSuffix $src "-light.png" -}}
  <img class="hx:dark:hidden" src="{{ $src | safeURL }}" alt="{{ .PlainText }}" loading="lazy"{{ with .Title }} title="{{ . }}"{{ end }}>
  <img class="hx:hidden hx:dark:block" src="{{ replace $src "-light.png" "-dark.png" | safeURL }}" alt="{{ .PlainText }}" loading="lazy"{{ with .Title }} title="{{ . }}"{{ end }}>
{{- else -}}
  <img src="{{ $src | safeURL }}" alt="{{ .PlainText }}" loading="lazy"{{ with .Title }} title="{{ . }}"{{ end }}>
{{- end -}}
