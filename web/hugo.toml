baseURL = 'https://taikonaut.dev/'
locale = 'en-us'
title = 'Hypercube'

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']
uglyURLs = true

[[module.mounts]]
source = 'content'
target = 'content'

[[module.mounts]]
source = '../docs'
target = 'content/docs'
files = ['*.md']

[[module.mounts]]
source = 'static'
target = 'static'

[[module.mounts]]
source = '../docs/images'
target = 'static/docs/images'

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.renderHooks.link]
useEmbedded = 'always'

[[module.imports]]
path = 'github.com/imfing/hextra'

[menu]
  [[menu.main]]
  name = 'Features'
  pageRef = '/features'
  weight = 1
  [[menu.main]]
  name = 'Docs'
  pageRef = '/docs'
  weight = 2
  [[menu.main]]
  name = 'Search'
  weight = 3
  [menu.main.params]
  type = 'search'
  [[menu.main]]
  name = 'GitHub'
  url = 'https://github.com/kkestell/hypercube'
  weight = 4
  [menu.main.params]
  icon = 'github'
  [[menu.main]]
  name = 'Appearance'
  weight = 5
  [menu.main.params]
  type = 'theme-toggle'

[params.theme]
displayToggle = false

[params.navbar]
displayLogo = false

[params.footer]
displayPoweredBy = false

# Guide titles and order. The shared guides carry no frontmatter.
[[cascade]]
  title = 'Your first session'
  weight = 1
  [cascade._target]
    path = '/docs/getting-started'
